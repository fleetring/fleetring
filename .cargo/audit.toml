# `cargo audit` policy. Keep it in step with `[advisories] ignore` in deny.toml: an advisory is
# ignored in both places, with the same reason, or in neither.

[advisories]
ignore = [
    # chrono is unmaintained (informational, no vulnerability, no patched version); it reaches us only through rmcp and schemars, the MCP server's dependencies. Drop this once rmcp moves off chrono (FR-119).
    "RUSTSEC-2026-0543",
]
