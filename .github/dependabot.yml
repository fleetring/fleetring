# Bumps the commit SHAs that pin every workflow action (FR-048).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One weekly PR for every action bump, so CI runs once per week, not once per action.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
