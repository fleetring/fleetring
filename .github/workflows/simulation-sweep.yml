# Nightly sweep of the simulation harness over random seeds (FR-024, ADR-0020). Every failing
# seed is printed with the command that reruns it alone; add it to the fixed seeds as a
# regression test once it is fixed.
name: Simulation sweep

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "How many random seeds to run"
        required: false
        default: "500"
      fork_seeds:
        description: "How many seeds the fork matrix sweeps per row"
        required: false
        default: "200"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Lets turmoil seed Tokio's scheduler, so a printed seed replays exactly.
  RUSTFLAGS: --cfg tokio_unstable

jobs:
  sweep:
    name: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SEEDS: ${{ github.event.inputs.seeds || '500' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p fleetringd --features simulation --test sim --no-run
      - name: run random seeds
        run: |
          failed=""
          for _ in $(seq "$SEEDS"); do
            seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
            if ! FLEETRING_SIM_SEED="$seed" cargo test -q -p fleetringd --features simulation \
                --test sim > "seed-$seed.log" 2>&1; then
              echo "::error::simulation seed $seed failed"
              cat "seed-$seed.log"
              failed="$failed $seed"
            else
              rm "seed-$seed.log"
            fi
          done
          if [ -n "$failed" ]; then
            {
              echo "## Failing simulation seeds"
              echo
              for seed in $failed; do
                echo "- \`RUSTFLAGS=\"--cfg tokio_unstable\" FLEETRING_SIM_SEED=$seed cargo test -p fleetringd --features simulation --test sim\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "failing seeds:$failed"
            exit 1
          fi
          echo "all $SEEDS seeds passed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: simulation-sweep-logs
          path: seed-*.log

  # FR-087's fork matrix: every row over its own seeds, each at the seeding step its seed picks
  # (the ignored `sweep_row_*` tests), but the rows ignored for open bugs. It needs the fault hooks, which refuse a build without
  # debug assertions, so it runs optimized with them kept. Run with `fork_seeds: 1000` for the
  # acceptance sweep of #137.
  fork-matrix:
    name: fork matrix sweep
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      FLEETRING_SIM_SWEEP_SEEDS: ${{ github.event.inputs.fork_seeds || '200' }}
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: |
          FLEETRING_SIM_SWEEP_FROM=$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')
          echo "sweeping from seed $FLEETRING_SIM_SWEEP_FROM"
          export FLEETRING_SIM_SWEEP_FROM
          cargo test --release -p fleetringd --features simulation,fault-hooks --test sim \
            -- --ignored sweep_row \
            --skip sweep_row_13_lost_and_duplicated --skip sweep_row_17_partitions_while_seeding
