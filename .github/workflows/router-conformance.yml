# Nightly: @libsql/client, unchanged, against the router in front of a three-node fleet (FR-066,
# ADR-0037). The `libsql` crate's remote client runs on every pull request in CI's `router
# conformance (libsql)` job; this one needs Node and a release build, so it runs once a day.
#
# Locally, from the repository root:
#   cargo build --release -p fleetringd --bin fleetring
#   tests/router/start-fleet.sh target/release/fleetring "$(mktemp -d)" > fleet.env
#   (cd tests/router/node && npm ci && env $(cat ../../../fleet.env) node conformance.mjs)
#   tests/router/stop-fleet.sh <the same directory>
name: Router conformance (Node)

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  node:
    name: "@libsql/client"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p fleetringd --bin fleetring
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: tests/router/node
      - name: start a fleet and a router
        run: tests/router/start-fleet.sh target/release/fleetring "$RUNNER_TEMP/fleet" >> "$GITHUB_ENV"
      - run: node conformance.mjs
        working-directory: tests/router/node
      - name: stop the fleet
        if: always()
        run: tests/router/stop-fleet.sh "$RUNNER_TEMP/fleet"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: router-conformance-logs
          path: ${{ runner.temp }}/fleet/*.log
