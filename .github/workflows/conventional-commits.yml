name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .{1,72}$'
          fail=0
          if [ -n "$PR_TITLE" ] && ! printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title is not a Conventional Commit: $PR_TITLE"; fail=1
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          git log --no-merges --format=%s "$range" | while read -r subject; do
            case "$subject" in Revert\ *|fixup!\ *|squash!\ *) continue ;; esac
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::Bad commit message: $subject"; exit 1
            fi
          done || fail=1
          exit $fail
