# Release builds of `fleetringd` (FR-034). A `fleetringd-vX.Y.Z` tag builds the daemon for every
# target on a native runner, packages each build with the licenses and a README, checksums the
# archives, and attaches them to the tag's GitHub release. A manual run is a dry run: it builds
# and packages everything as workflow artifacts and publishes nothing.
#
# The `fleetring` crate is released separately, to crates.io, from `fleetring-v*` tags
# (RELEASING.md).
name: Release

on:
  push:
    tags: ["fleetringd-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The compiler for every archive. Keep it equal to RUST_VERSION in the Dockerfile.
  RUST_VERSION: "1.99"

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The tag names the version `fleetringd --version` prints, so they must agree.
      - id: version
        name: read the version and check it against the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/fleetringd/Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::crates/fleetringd/Cargo.toml has no version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "fleetringd-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match fleetringd's version, $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # GitHub is retiring its Intel macOS runners, and Apple's toolchain builds for both
          # architectures, so both macOS targets build on Apple Silicon.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Linux builds run in Debian 12, so the binaries need glibc 2.36, not the runner's 2.39,
      # and match the container image's runtime.
      - name: build (in rust:${{ env.RUST_VERSION }}-slim-bookworm)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/fleetring" -w /fleetring \
            -e CARGO_INCREMENTAL -e CARGO_TERM_COLOR \
            -e RUSTFLAGS="--remap-path-prefix=/usr/local/cargo=/cargo" \
            "rust:$RUST_VERSION-slim-bookworm" \
            cargo build --locked --release -p fleetringd --target "$TARGET"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: runner.os != 'Linux'
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      # The remaps keep the runner's directories out of the binary. Windows links the C runtime
      # statically, so the binary runs without the Visual C++ redistributable.
      - name: build
        if: runner.os != 'Linux'
        run: |
          rustflags="--remap-path-prefix=$GITHUB_WORKSPACE=/fleetring"
          rustflags="$rustflags --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          if [ "$TARGET" = x86_64-pc-windows-msvc ]; then
            rustflags="$rustflags -C target-feature=+crt-static"
          fi
          RUSTFLAGS="$rustflags" cargo build --locked --release -p fleetringd --target "$TARGET"

      # Every target but Intel macOS runs on its runner.
      - name: smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          case "$TARGET" in *-windows-*) exe=.exe ;; *) exe="" ;; esac
          printed=$("target/$TARGET/release/fleetringd$exe" --version)
          echo "$printed"
          test "$printed" = "fleetringd $VERSION"

      - name: package
        run: |
          name="fleetringd-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp LICENSE-APACHE LICENSE-MIT "dist/$name/"
          cp crates/fleetringd/README.md "dist/$name/README.md"
          cd dist
          case "$TARGET" in
            *-windows-*)
              cp "../target/$TARGET/release/fleetringd.exe" "$name/"
              7z a -tzip "$name.zip" "$name" > /dev/null
              ;;
            *-linux-*)
              cp "../target/$TARGET/release/fleetringd" "$name/"
              tar --owner=0 --group=0 --numeric-owner -czf "$name.tar.gz" "$name"
              ;;
            *)
              cp "../target/$TARGET/release/fleetringd" "$name/"
              tar --uid 0 --gid 0 --numeric-owner -czf "$name.tar.gz" "$name"
              ;;
          esac
          rm -r "$name"
          ls -l

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fleetringd-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: checksums and release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Fails the release on any unresolved advisory, warnings included. A reviewed exception
      # goes in `.cargo/audit.toml` and `deny.toml`, with its reason.
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-audit
      - name: audit the locked dependencies
        run: cargo audit --deny warnings
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fleetringd-*
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cp scripts/install.sh dist/
          cd dist
          for file in *; do
            sha256sum "$file" > "$file.sha256"
          done
          sha256sum -- *.tar.gz *.zip install.sh > SHA256SUMS
          cat SHA256SUMS

      # Keyless: the certificate names this workflow run's OIDC identity, and the signature is
      # logged in the public Rekor transparency log. No signing key lives in the repository.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign SHA256SUMS
        working-directory: dist
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS
      # Attests the archives and the install script, the files a user runs or unpacks.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/install.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fleetringd-${{ env.VERSION }}-dist
          path: dist/*
          if-no-files-found: error

      # Only a tag publishes; a manual run stops at the artifacts above. Rerunning a tag's
      # workflow replaces the release's files.
      - name: publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          cat > notes.md <<EOF
          The \`fleetringd\` daemon, version $VERSION.

          Install the binary for this machine, verified against \`SHA256SUMS\`:

          \`\`\`sh
          curl -fsSL https://github.com/$GH_REPO/releases/download/$TAG/install.sh | sh -s -- --version $VERSION
          \`\`\`

          Or run the container image: \`docker run ghcr.io/fleetring/fleetringd:$VERSION\`.

          \`SHA256SUMS\` is signed by this repository's release workflow, and every archive and
          \`install.sh\` has build provenance. To verify a download:

          \`\`\`sh
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\
            --certificate-identity-regexp '^https://github.com/$GH_REPO/.github/workflows/release.yml@refs/tags/fleetringd-v' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify <file> --repo $GH_REPO
          \`\`\`
          EOF
          gh release create "$TAG" dist/* --verify-tag --title "fleetringd $VERSION" \
            --notes-file notes.md "${flags[@]}"
