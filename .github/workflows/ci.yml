# CI for the FleetRing workspace (ADR-0009). The cross-target jobs exist because placement must
# be bit-identical on big-endian, 32-bit, and wasm targets as well as the three major OSes
# (ADR-0008).
#
# Pull requests, merge groups, and manual runs run every job. A push to `main` runs only `cache`,
# at the end of this file. The `main` ruleset merges a pull request only once every required
# check has passed on a branch that is up to date with `main`, and merges by rebase, so the tree a
# merge puts on `main` is the tree that pull request's CI already tested. Running the matrix again
# on `main` would test the same tree twice. What `main` must still do is save the build cache that
# new pull requests restore from.
name: CI

on:
  pull_request:
  # Runs for GitHub's merge queue, if it is turned on for `main`.
  merge_group:
  # Runs only `cache`; every other job checks `github.event_name != 'push'`.
  push:
    branches: [main]
  # Runs everything. Run it on `main` after a toolchain or Cargo.lock change to refresh every
  # job's cache there, not only the one `cache` keeps warm.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Line tables keep file and line numbers in backtraces, and leave out the rest of the debug
  # information, which made most of each test binary: the Linux test job builds the workspace
  # three times and ran out of disk (#97).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    name: fmt
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Linux job builds the workspace in three configurations, and the upgrade tests copy the
      # daemon's binary, so it needs more than the runner's free disk: drop toolchains it never
      # uses (#97).
      - name: free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # On Windows runners the default temp directory is on C:, where an fsync takes 20-70 ms and
      # stalls for seconds every few minutes; the workspace disk takes about 0.3 ms. The
      # replication tests fsync every write, so they keep their files on the workspace disk (#54).
      - name: temp directory on the workspace disk
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: all features
        if: runner.os == 'Linux'
        run: cargo test --workspace --all-features --no-fail-fast
      # The simulation tests are deterministic and OS-independent, and Linux already runs them in
      # three jobs, so macOS and Windows run every feature except `simulation` (ADR-0014).
      - name: all features except simulation
        if: runner.os != 'Linux'
        run: cargo test --workspace --features fleetring/serde,fleetring/test-util --no-fail-fast
      # Feature combinations and the release profile don't depend on the OS, so only Linux runs
      # them; macOS and Windows run the suite once (ADR-0014).
      - name: default features
        if: runner.os == 'Linux'
        run: cargo test --workspace --no-fail-fast
      # Only the placement crate has default features (`std`); every other crate builds the same
      # with or without them, so running their suites again here would repeat the step above.
      - name: no default features
        if: runner.os == 'Linux'
        run: cargo test -p fleetring --no-default-features --no-fail-fast
      - name: all features, release
        if: runner.os == 'Linux'
        run: cargo test --workspace --all-features --release --no-fail-fast
      # Runs every example, so a new one can't be left out. `cargo test` already builds them
      # on every OS, so running them on one is enough.
      - name: examples
        if: runner.os == 'Linux'
        run: |
          for example in crates/fleetring/examples/*.rs; do
            cargo run -p fleetring --all-features --example "$(basename "$example" .rs)"
          done

  # Linux ARM64, natively, where most small self-hosted machines run (FR-034). macOS ARM64 is
  # covered above: `macos-latest` is an Apple Silicon runner.
  test-arm64:
    name: test (ubuntu-24.04-arm)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: all features
        run: cargo test --workspace --all-features --no-fail-fast
      - name: simulation (fixed seeds)
        env:
          RUSTFLAGS: --cfg tokio_unstable
        run: cargo test -p fleetringd --features simulation --test sim --no-fail-fast

  statistics:
    name: statistical suite (release)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p fleetring --all-features --release --no-fail-fast -- --ignored

  # The simulation harness's fixed seeds (FR-024, ADR-0020). `--cfg tokio_unstable` lets turmoil
  # seed Tokio's scheduler, so each seed must replay its trace exactly, simulated times included.
  # The test jobs above run the same tests without it, comparing event order only.
  simulation:
    name: simulation (fixed seeds)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: --cfg tokio_unstable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p fleetringd --features simulation --test sim --no-fail-fast

  msrv:
    name: msrv (1.88)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --exclude fleetringd --all-features --all-targets
      # The daemon may need a newer toolchain than the libraries (ADR-0015, point 7).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
      - run: cargo +1.89 check -p fleetringd --all-features --all-targets

  docs:
    name: docs
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --all-features

  i686:
    name: test (i686, 32-bit)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo test -p fleetring -p fleetring-control -p fleetring-wal --all-features --target i686-unknown-linux-gnu --no-fail-fast

  # Emulated targets run optimized with fewer proptest cases to stay fast; the native debug jobs
  # still catch overflow, and every property runs at full strength there.
  s390x:
    name: test (s390x, big-endian)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROPTEST_CASES: "32"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cross
      - run: cross test -p fleetring -p fleetring-control -p fleetring-wal --all-features --release --target s390x-unknown-linux-gnu --no-fail-fast
      # Proves the tests above ran big-endian: a build for the host by mistake would leave
      # little-endian (LSB) binaries here, or none at all.
      - name: test binaries are big-endian
        run: |
          file target/s390x-unknown-linux-gnu/release/deps/it-* | grep -v '\.d:' | tee /dev/stderr \
            | grep -q 'MSB.*S/390'

  wasm:
    name: test (wasm32-wasip1)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
      PROPTEST_CASES: "32"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-wasip1, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: wasmtime
      - run: cargo test -p fleetring -p fleetring-control -p fleetring-wal --all-features --release --target wasm32-wasip1 --no-fail-fast
      - run: cargo build -p fleetring --all-features --target wasm32-unknown-unknown

  # An implementation written from docs/spec/placement-v1.md alone must reproduce every golden
  # vector, which shows the spec, not just the Rust crate, defines placement (FR-014).
  spec-reference:
    name: spec reference (Python)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: pip install xxhash
      - run: python scripts/placement_ref.py crates/fleetring/tests/vectors/placement-v1.json

  # Compares the public API with the latest release on crates.io, so a breaking change can't
  # ship without the version bump it needs (FR-019).
  semver:
    name: semver-checks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-semver-checks
      - run: cargo semver-checks --package fleetring

  deny:
    name: cargo-deny
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny
      - run: cargo deny check

  # The only job a push to `main` runs (see the top of this file). A pull request can restore
  # caches saved on its base branch, and Swatinem/rust-cache saves only when no cache has its
  # exact key, so the caches saved on `main` are what every new pull request starts from.
  #
  # rust-cache's key is `v0-rust`, then `shared-key` or else the job ID, then the runner's OS and
  # architecture, then a hash of `rustc -vV` and every CARGO*, RUST*, CC*, CFLAGS*, CXX*, and
  # CMAKE* environment variable, then a hash of Cargo.lock and the manifests. With
  # `shared-key: test`, this job's key is the one the `ubuntu-latest` leg of `test` uses, whose
  # job ID is `test`; keep its toolchain and environment equal to that leg's, or the keys part.
  # It builds the four feature and profile combinations that leg runs, without running them, so
  # the cache holds the same dependencies. The other jobs' caches on `main` aren't refreshed by
  # pushes; a manual run on `main` refreshes them.
  cache:
    name: cache (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
      - run: cargo test --workspace --all-features --no-run
      - run: cargo test --workspace --no-run
      - run: cargo test --workspace --no-default-features --no-run
      - run: cargo test --workspace --all-features --release --no-run
