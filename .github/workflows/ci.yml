# CI for the FleetRing workspace (ADR-0009). The cross-target jobs exist because placement must
# be bit-identical on big-endian, 32-bit, and wasm targets as well as the three major OSes
# (ADR-0008).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: default features
        run: cargo test --workspace --no-fail-fast
      - name: all features
        run: cargo test --workspace --all-features --no-fail-fast
      - name: no default features
        run: cargo test --workspace --no-default-features --no-fail-fast
      - name: all features, release
        run: cargo test --workspace --all-features --release --no-fail-fast
      # Runs every example, so a new one can't be left out. `cargo test` already builds them
      # on every OS, so running them on one is enough.
      - name: examples
        if: runner.os == 'Linux'
        run: |
          for example in crates/fleetring/examples/*.rs; do
            cargo run -p fleetring --all-features --example "$(basename "$example" .rs)"
          done

  statistics:
    name: statistical suite (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fleetring --all-features --release --no-fail-fast -- --ignored

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  i686:
    name: test (i686, 32-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo test -p fleetring --all-features --target i686-unknown-linux-gnu --no-fail-fast

  # Emulated targets run optimized with fewer proptest cases to stay fast; the native debug jobs
  # still catch overflow, and every property runs at full strength there.
  s390x:
    name: test (s390x, big-endian)
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: "32"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross test -p fleetring --all-features --release --target s390x-unknown-linux-gnu --no-fail-fast

  wasm:
    name: test (wasm32-wasip1)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
      PROPTEST_CASES: "32"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime
      - run: cargo test -p fleetring --all-features --release --target wasm32-wasip1 --no-fail-fast
      - run: cargo build -p fleetring --all-features --target wasm32-unknown-unknown

  # An implementation written from docs/spec/placement-v1.md alone must reproduce every golden
  # vector, which shows the spec, not just the Rust crate, defines placement (FR-014).
  spec-reference:
    name: spec reference (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install xxhash
      - run: python scripts/placement_ref.py crates/fleetring/tests/vectors/placement-v1.json

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
