# Fork measurements on the CI Linux runner (FR-087, ADR-0046 point 7), for `docs/perf.md` under
# "Forks". It runs only when a pull request is labelled `measure-forks`: a run forks sources of
# 10 MiB, 100 MiB and 1 GiB on a three-node fleet in one process and takes about a quarter of an
# hour, and shared runners are too noisy to gate on. Its own workflow, triggered on `labeled`
# alone, so that labelling a pull request never re-runs CI, whose `pull_request` trigger keeps
# its default types. To measure again, remove the label and add it again.
name: Fork measurements

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  measure:
    name: fork measurements
    # The label just added, so that adding another label to a pull request that carries it
    # doesn't measure again.
    if: github.event.label.name == 'measure-forks'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The 1 GiB case holds about 7 GiB at its peak (three replicas of the source, three staged
      # copies, three forks), beside the release build.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo bench -p fleetringd --bench fork --no-run
      - name: hardware
        run: |
          {
            echo "## Fork measurements: hardware"
            echo
            echo '```text'
            date -u +%Y-%m-%d
            lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core)'
            free -h | head -2
            df -h "${RUNNER_TEMP}"
            lsblk -d -o NAME,MODEL,ROTA,SIZE
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: measure
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          cargo bench -p fleetringd --bench fork > fork-measurements.md
          {
            echo "## Fork measurements"
            echo
            cat fork-measurements.md
          } | tee -a "$GITHUB_STEP_SUMMARY"
