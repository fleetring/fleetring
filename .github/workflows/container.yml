# The `fleetring` container image (FR-034). A `fleetringd-vX.Y.Z` tag builds `linux/amd64` and
# `linux/arm64`, each natively on a runner of its own architecture (no QEMU), pushes both by
# digest, and joins them into one multi-arch manifest tagged `X.Y.Z`, plus `X.Y` and `latest` for
# a final release. A manual run builds and smoke-tests both images and pushes nothing.
#
# The image is ghcr.io/fleetring/fleetring. Until 1.0 the same manifest is also pushed as
# ghcr.io/fleetring/fleetringd, its name before 0.7, with the same tags and attestations
# (ADR-0043, point 1.8).
name: Container

on:
  push:
    tags: ["fleetringd-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/fleetring/fleetring
  # The image's name before 0.7, pushed too until 1.0.
  COMPAT_IMAGE: ghcr.io/fleetring/fleetringd
  DESCRIPTION: FleetRing. Places, replicates, and fails over SQLite databases across machines you own.

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: read the version and check it against the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/fleetringd/Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::crates/fleetringd/Cargo.toml has no version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "fleetringd-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match fleetringd's version, $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds into the runner's Docker first, to check the image before anything is pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: fleetring:smoke
      # The binary names itself after the file it runs as; `fleetringd` is a link to it.
      - name: smoke test
        run: |
          printed=$(docker run --rm fleetring:smoke --version)
          echo "$printed"
          test "$printed" = "fleetring $VERSION"
          printed=$(docker run --rm --entrypoint /usr/local/bin/fleetringd fleetring:smoke --version)
          echo "$printed"
          test "$printed" = "fleetringd $VERSION"
          user=$(docker image inspect --format '{{.Config.User}}' fleetring:smoke)
          echo "runs as $user"
          test "$user" = "65532:65532"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The same build again, from the builder's cache, pushed by digest only; the merge job tags
      # the manifest that joins both architectures.
      - id: push
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=fleetring
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          outputs: type=image,"name=${{ env.IMAGE }},${{ env.COMPAT_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
      # Attests this architecture's image under both names, so `gh attestation verify` also works
      # on the digest that a platform-specific pull resolves to.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-name: ${{ env.COMPAT_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: record the digest
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: push the manifest
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # A prerelease (`X.Y.Z-rc.1`) gets its own tag only; a final release also moves `X.Y` and
      # `latest`. Each tag is pushed under both names.
      - name: create the manifest
        working-directory: digests
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tags=()
          for image in "$IMAGE" "$COMPAT_IMAGE"; do
            tags+=(--tag "$image:$VERSION")
            case "$VERSION" in
              *-*) ;;
              *) tags+=(--tag "$image:${VERSION%.*}" --tag "$image:latest") ;;
            esac
          done
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.title=fleetring" \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.licenses=MIT OR Apache-2.0" \
            "${sources[@]}"
      - name: inspect
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$COMPAT_IMAGE:$VERSION"
      # The multi-arch manifest is what `docker pull $IMAGE:$VERSION` resolves, so it is attested
      # too, under both names. Both names must resolve to the same manifest.
      - id: index
        name: read the manifest's digest
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in sha256:*) ;; *) echo "::error::no digest for $IMAGE:$VERSION"; exit 1 ;; esac
          compat=$(docker buildx imagetools inspect "$COMPAT_IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          if [ "$compat" != "$digest" ]; then
            echo "::error::$COMPAT_IMAGE:$VERSION is $compat, not $digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.COMPAT_IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
