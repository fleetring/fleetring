# Nightly fuzzing (FR-017). Untrusted ring specs and arbitrary memberships must never panic, and
# every ring must keep its placement invariants (ADR-0006, ADR-0007, ADR-0008).
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [spec_json, builder, lookup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-fuzz
      - name: fuzz for five minutes
        run: |
          seeds="fuzz/seeds/${{ matrix.target }}"
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          if [ -d "$seeds" ]; then extra="$seeds"; else extra=""; fi
          # The prebuilt cargo-fuzz targets musl by default, which the address sanitizer rejects.
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            "fuzz/corpus/${{ matrix.target }}" $extra -- -max_total_time=300
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts
