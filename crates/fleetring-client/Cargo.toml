[package]
name = "fleetring-client"
description = "What every FleetRing client shares: contexts, the redirects it follows, and the typed results it prints."
version = "0.0.0"
publish = false
edition.workspace = true
# `File::lock` (the contexts file's lock) needs 1.89. The libraries keep the workspace's MSRV.
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
# For the characters text output escapes, which a description refuses.
fleetring-control = { version = "0.0.0", path = "../fleetring-control" }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
toml = "1.1.8"
# The redirect replies are gRPC statuses with metadata; no transport.
tonic = { version = "0.14", default-features = false }
tracing = "0.1.44"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.27.0"

[lints]
workspace = true
