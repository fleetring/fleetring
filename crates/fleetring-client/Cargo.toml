[package]
name = "fleetring-client"
description = "What a FleetRing client command needs before it dials a node: contexts, and the directories they live in."
version = "0.0.0"
publish = false
edition.workspace = true
# `File::lock` (the contexts file's lock) needs 1.89. The libraries keep the workspace's MSRV.
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
