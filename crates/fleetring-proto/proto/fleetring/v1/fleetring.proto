// The wire contract between FleetRing nodes (ADR-0019). Fields evolve compatibly under protobuf's
// rules; a breaking change gets a new package version and a new major protocol version.
//
// Log positions and batch payloads are opaque bytes that only engine adapters interpret
// (ADR-0016). Positions compare lexicographically in log order.
syntax = "proto3";

package fleetring.v1;

// The protocol version a peer speaks. Peers exchange it at Join; a node refuses another major.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

// A node's identity and placement attributes, and the address its peers reach it at.
message Node {
  string id = 1;
  optional string zone = 2;
  optional string host = 3;
  uint32 weight = 4;
  // `host:port`. Not a placement attribute. Unset by nodes older than this field.
  optional string address = 5;
}

// What a node runs (ADR-0038): its release, and the newest protocol, control-log format, and
// fleet features it speaks. A node that sends none is taken to run 0.3.0: protocol 1.0,
// control-log format 1, and no features.
message Software {
  // The release, `MAJOR.MINOR.PATCH` with an optional prerelease, as `fleetringd --version`
  // prints it.
  string version = 1;
  ProtocolVersion protocol = 2;
  // The newest `control.db` format the node reads.
  uint32 control_format = 3;
  // The fleet features the node can apply and act on, by name, such as `undrain`. A command that
  // needs a feature is refused until every member lists it; names a node doesn't know are
  // ignored.
  repeated string features = 4;
}

// The storage engine behind a database (ADR-0021).
enum Engine {
  ENGINE_UNSPECIFIED = 0;
  ENGINE_SQLITE = 1;
}

// How many replicas must store a write before it is acknowledged (ADR-0023). Unspecified means
// the fleet's default in a request, and `quorum` from a control node that predates the field.
enum Acks {
  ACKS_UNSPECIFIED = 0;
  // A majority: W = floor(R/2) + 1.
  ACKS_QUORUM = 1;
  // Every replica: W = R. One replica down blocks writes.
  ACKS_ALL = 2;
  // The primary alone: W = 1. A failover may lose acknowledged writes.
  ACKS_LOCAL = 3;
}

// A replica's role: whether the node that reports it is the database's primary or a follower.
enum ReplicaRole {
  REPLICA_ROLE_UNSPECIFIED = 0;
  REPLICA_ROLE_PRIMARY = 1;
  REPLICA_ROLE_FOLLOWER = 2;
}

// ---- Control ----------------------------------------------------------------------------------

// Every RPC states, in a `Scope:` line, what its caller needs (ADR-0025): `node` (a node
// certificate; principals are refused), `fleet` (a node, or a principal with the `fleet`
// scope), an action on the database the request names, or, for a listing, the action on each
// database it shows. A node call also states, in a `Binding:` line, what the calling node must
// be for the database or node the request names (ADR-0031): `self` (the request names the
// caller), `replica` (in the database's replica set), `holder` (it holds the database's lease),
// `candidate` (the candidate of the promotion to the request's epoch), `holder or candidate`
// (either, at the stream's epoch), or `follower` (one the primary streams the database to). A
// call that fails its binding is refused with PERMISSION_DENIED and `fleetring-binding`
// metadata naming the binding. `fleetringd::auth::RPCS` holds the same table, and tests keep
// the two equal; a request for an RPC the table doesn't list is refused.

service Control {
  // Scope: node.
  // Binding: self.
  rpc Join(JoinRequest) returns (JoinResponse);
  // Scope: node.
  // Binding: self.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Scope: fleet.
  rpc WatchMembership(WatchMembershipRequest) returns (stream MembershipUpdate);
  // Scope: admin on the database.
  rpc CreateDatabase(CreateDatabaseRequest) returns (CreateDatabaseResponse);
  // Removes a database for good: its record, lease, and any promotion. Its replicas close and
  // delete their copies once they learn of it; `Locate` answers NOT_FOUND from then on.
  // Scope: admin on the database.
  rpc DropDatabase(DropDatabaseRequest) returns (DropDatabaseResponse);
  // Records new durability settings for a database, which take effect at its next lease
  // (ADR-0023).
  // Scope: admin on the database.
  rpc ChangeDurability(ChangeDurabilityRequest) returns (ChangeDurabilityResponse);
  // Scope: read on the database, or fleet.
  rpc Locate(LocateRequest) returns (LocateResponse);
  // Every database's placement, in name order.
  // Scope: read per database listed, or fleet.
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse);
  // Scope: node.
  // Binding: self.
  rpc AcquireLease(AcquireLeaseRequest) returns (LeaseResponse);
  // Scope: node.
  // Binding: self.
  rpc RenewLease(RenewLeaseRequest) returns (LeaseResponse);
  // Removes a member, as a node does when it shuts down gracefully.
  // Scope: fleet.
  // Binding: self.
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  // The promotion calls (ADR-0018): the control node starts a promotion once a lease has
  // expired by the failover margin and tells the candidate, which fences replicas, records each
  // one, and completes the promotion.
  // Scope: node.
  // Binding: replica.
  rpc StartPromotion(StartPromotionRequest) returns (PromotionResponse);
  // Scope: node.
  // Binding: candidate.
  rpc RecordFenced(RecordFencedRequest) returns (RecordFencedResponse);
  // Scope: node.
  // Binding: candidate.
  rpc CompletePromotion(CompletePromotionRequest) returns (CompletePromotionResponse);
  // Clears a member's draining mark, so that it may take leases again without a restart. A fleet
  // feature (`undrain`): refused with FAILED_PRECONDITION until every member supports it. An
  // operator's call: nodes never make it.
  // Scope: fleet.
  rpc Undrain(UndrainRequest) returns (UndrainResponse);
  // Marks a member as draining: it gets no new lease and is never a promotion's candidate. The
  // member sees the mark in its membership updates and hands its leases over with
  // TransferLease, then leaves if it is shutting down.
  // Scope: fleet.
  // Binding: self.
  rpc Drain(DrainRequest) returns (DrainResponse);
  // Hands a database's lease from its draining holder to a follower without waiting for the
  // lease to expire: starts a promotion at the next epoch whose candidate is the named target,
  // or the most advanced live follower. The candidate completes it as after an expiry.
  // Scope: admin on the database.
  // Binding: holder.
  rpc TransferLease(TransferLeaseRequest) returns (PromotionResponse);
  // Adds a bearer token, or every token a signing key issued, to the denylist every node checks
  // before it trusts a token (ADR-0025). Data nodes learn the list from their heartbeat replies,
  // so a revocation reaches every live node within one heartbeat interval.
  // Scope: fleet.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);
}

message JoinRequest {
  ProtocolVersion protocol = 1;
  Node node = 2;
  // Unset by nodes older than this field, which run 0.3.0. A join whose release is more than one
  // release line from a member's, or that lacks a feature the fleet has enabled, is refused with
  // FAILED_PRECONDITION.
  Software software = 3;
}

message JoinResponse {
  ProtocolVersion protocol = 1;
  uint64 membership_epoch = 2;
  // Every revoked token and signing key the control plane lists, as in `HeartbeatResponse`, so
  // a node that starts has a denylist before its first heartbeat. Empty from a control node that
  // predates the field.
  repeated Revocation revocations = 3;
}

message DatabaseStatus {
  string database = 1;
  ReplicaRole role = 2;
  // The epoch of the primary that wrote the last frames of this replica's log: the primary's
  // own epoch on a primary. Promotions rank logs by it before their positions.
  uint64 epoch = 3;
  bytes position = 4;
}

message HeartbeatRequest {
  string node_id = 1;
  repeated DatabaseStatus databases = 2;
  // Unset by nodes older than this field. Corrects the control plane's record of the node's
  // software, as after the control node was upgraded; never a reason to refuse the heartbeat.
  Software software = 3;
}

message HeartbeatResponse {
  uint64 membership_epoch = 1;
  // Reported databases the control plane doesn't know. Their reports were left out; the rest of
  // the heartbeat counted.
  repeated string unknown_databases = 2;
  // Every revoked token and signing key the control plane lists, in order. Empty from a control
  // node that predates the field.
  repeated Revocation revocations = 3;
}

// A token or signing key on the denylist, and when the entry may be forgotten.
message Revocation {
  oneof revoked {
    // A token's `jti`.
    string token_id = 1;
    // A signing key's `kid`: every token it signed.
    string key_id = 2;
  }
  // Milliseconds since the Unix epoch; the maximum value means never.
  uint64 until_ms = 3;
}

message RevokeTokenRequest {
  Revocation revocation = 1;
}

message RevokeTokenResponse {
  // When the entry will be forgotten: the later of this request's and any earlier revocation's.
  uint64 until_ms = 1;
}

message WatchMembershipRequest {
  uint64 after_epoch = 1;
}

message Member {
  Node node = 1;
  bool live = 2;
  // Set while the member is draining: handing its leases over before it leaves.
  bool draining = 3;
  // What the member runs, as it last reported; unset if it reported nothing, as 0.3.0 doesn't,
  // or if the control node predates the field.
  Software software = 4;
}

message MembershipUpdate {
  uint64 membership_epoch = 1;
  repeated Member members = 2;
  // The fleet features the fleet has enabled for good, by name (ADR-0038): a node whose release
  // lacks one can't join, so `fleetringd upgrade` refuses to install such a release. Empty from a
  // control node that predates the field.
  repeated string features = 3;
  // Set when the control node runs in dev mode (ADR-0039): one node on loopback with a local
  // authority, for development only. Unset by a control node that predates the field.
  bool dev_mode = 4;
}

message CreateDatabaseRequest {
  string database = 1;
  // Replicas, the primary included; 0 for the fleet's default, which the control node fills in
  // before it logs the creation. Control nodes before 0.5.0 refuse 0.
  uint32 replication_factor = 2;
  Engine engine = 3;
  // The acknowledgement mode; unspecified for the fleet's default.
  Acks acks = 4;
  // The floor on reachable replicas, the primary included, below which writes are refused;
  // 0 for the default, the mode's write quorum W.
  uint32 min_replicas = 5;
}

message ChangeDurabilityRequest {
  string database = 1;
  Acks acks = 2;
  // 0 for the mode's write quorum W.
  uint32 min_replicas = 3;
}

message ChangeDurabilityResponse {
  // The settings that take effect at the next lease.
  Acks acks = 1;
  uint32 min_replicas = 2;
  // The settings in effect until then.
  Acks current_acks = 3;
  uint32 current_min_replicas = 4;
}

message CreateDatabaseResponse {
  Placement placement = 1;
}

message DropDatabaseRequest {
  string database = 1;
}

message DropDatabaseResponse {
  // The epoch the database was at when it was dropped.
  uint64 epoch = 1;
}

message LocateRequest {
  string database = 1;
}

message ListDatabasesRequest {}

message ListDatabasesResponse {
  repeated Placement databases = 1;
}

message LocateResponse {
  Placement placement = 1;
}

message Placement {
  string database = 1;
  Engine engine = 2;
  uint64 epoch = 3;
  // The lease holder, which serves writes at `epoch`. Unset before the first lease and while a
  // promotion to `epoch` is in progress.
  optional string primary = 4;
  repeated string followers = 5;
  // The whole replica set in the ring's preference order, the primary included.
  repeated Replica replicas = 6;
  // How many replicas the database should have. The replica set is smaller while there are
  // fewer members. 0 from a control node that predates the field.
  uint32 replication_factor = 7;
  // The durability settings in effect (ADR-0023). Unspecified and 0 from a control node that
  // predates the fields, which means `quorum` with the floor at W.
  Acks acks = 8;
  uint32 min_replicas = 9;
  // The node carrying out the promotion to `epoch`, while one is in progress (FR-050). Unset
  // otherwise, and from a control node that predates the field.
  optional string candidate = 10;
}

// One member of a database's replica set, as the control plane knows it.
message Replica {
  string node_id = 1;
  // `host:port`, if the member advertised one.
  optional string address = 2;
  bool live = 3;
  // What the member last reported for the database in a heartbeat, if it has.
  ReplicaRole reported_role = 4;
  optional bytes position = 5;
}

message AcquireLeaseRequest {
  string database = 1;
  string node_id = 2;
}

message RenewLeaseRequest {
  string database = 1;
  string node_id = 2;
  uint64 epoch = 3;
}

message LeaseResponse {
  string database = 1;
  uint64 epoch = 2;
  uint64 expires_at_ms = 3;
}

message LeaveRequest {
  string node_id = 1;
}

message LeaveResponse {
  uint64 membership_epoch = 1;
}

message StartPromotionRequest {
  string database = 1;
}

message PromotionResponse {
  string database = 1;
  // The promotion's new epoch.
  uint64 epoch = 2;
  string candidate = 3;
}

message RecordFencedRequest {
  string database = 1;
  string node_id = 2;
  uint64 epoch = 3;
  bytes position = 4;
}

message RecordFencedResponse {
  // How many replica-set members are fenced at the promotion's epoch, and how many must be.
  uint32 fenced = 1;
  uint32 needed = 2;
}

message CompletePromotionRequest {
  string database = 1;
  uint64 epoch = 2;
}

message CompletePromotionResponse {
  LeaseResponse lease = 1;
  // The most advanced position among the fenced members, as the control plane compares them.
  bytes adopted = 2;
}

message UndrainRequest {
  string node_id = 1;
}

message UndrainResponse {}

message DrainRequest {
  string node_id = 1;
}

message DrainResponse {
  // The databases the member holds the lease on, in name order: what it has to hand over.
  repeated string primaries = 1;
}

message TransferLeaseRequest {
  string database = 1;
  // The replica to hand the lease to, or empty to let the control plane pick the most advanced
  // live follower.
  string target = 2;
}

// ---- Replication ------------------------------------------------------------------------------

service Replication {
  // The primary opens one stream per follower and sends batches; the follower acknowledges.
  // Scope: node.
  // Binding: holder or candidate.
  rpc Replicate(stream ReplicateMessage) returns (stream ReplicateAck);
  // A promotion fences a replica at a new epoch and learns its position (ADR-0018).
  // Scope: node.
  // Binding: candidate.
  rpc Fence(FenceRequest) returns (FenceResponse);
  // Scope: node.
  // Binding: follower.
  rpc Snapshot(SnapshotRequest) returns (stream SnapshotChunk);
  // A candidate fetches the frames it lacks from the most advanced fenced member.
  // Scope: node.
  // Binding: candidate.
  rpc Fetch(FetchRequest) returns (FetchResponse);
  // The control node asks a promotion's candidate to carry it out.
  // Scope: node.
  // Binding: candidate.
  rpc Promote(PromoteRequest) returns (PromoteResponse);
}

message ReplicateMessage {
  oneof message {
    ReplicateOpen open = 1;
    Batch batch = 2;
    CheckpointMarker checkpoint = 3;
    Reseed reseed = 4;
  }
}

message ReplicateOpen {
  string database = 1;
  uint64 epoch = 2;
  // Where this epoch's log begins: the position its primary adopted when it was promoted. A
  // follower whose log came from an earlier epoch and runs past it truncates back to it first.
  // Unset for an epoch that started with the database.
  optional bytes epoch_start = 3;
}

// One or more committed transactions, as the engine encodes them.
message Batch {
  uint64 epoch = 1;
  bytes start = 2;
  bytes end = 3;
  bytes payload = 4;
  // The sender's hash chain at `end` (FR-044): BLAKE3 over each transaction in turn, each
  // folding in the hash before it. A follower recomputes it over the batch and refuses one
  // that doesn't match. Unset by a sender that predates the field.
  optional bytes chain = 5;
}

message CheckpointMarker {
  uint64 epoch = 1;
  bytes position = 2;
}

// The log no longer holds what the follower needs: it replaces its copy with a snapshot fetched
// through `Snapshot`, then acknowledges the snapshot's position.
message Reseed {
  uint64 epoch = 1;
}

message ReplicateAck {
  bytes position = 1;
  // Set when the follower's copy, at `position`, can't follow this epoch's log: on the first
  // acknowledgement, when it diverges before a point it can be cut back to, or later, when the
  // primary's frames don't continue it. The position isn't on the primary's log. The primary
  // answers with `Reseed`, and the follower takes no frames until it has.
  bool needs_snapshot = 2;
}

message FenceRequest {
  string database = 1;
  uint64 epoch = 2;
  // The node being promoted at `epoch`, the only one whose stream the replica accepts at it.
  // Empty from a caller that predates the field.
  string candidate = 3;
}

message FenceResponse {
  uint64 epoch = 1;
  bytes position = 2;
  // The epoch of the primary that wrote the last frames of the replica's log.
  uint64 log_epoch = 3;
}

message FetchRequest {
  string database = 1;
  // The promotion's epoch, at which the replica must already be fenced.
  uint64 epoch = 2;
  // The position the caller holds; empty for an empty log.
  bytes after = 3;
}

message FetchResponse {
  // Every committed transaction after `after`, or unset if there is none.
  optional Batch batch = 1;
  // The epoch of the primary that wrote the last frames of the replica's log.
  uint64 log_epoch = 2;
  // The replica's hash chain at the batch's end, or at `after` if there is no batch (FR-044).
  // Unset by a replica that predates the field, or whose chain doesn't reach there.
  optional bytes chain = 3;
}

message PromoteRequest {
  string database = 1;
  uint64 epoch = 2;
  uint32 replication_factor = 3;
}

message PromoteResponse {}

message SnapshotRequest {
  string database = 1;
  uint64 epoch = 2;
}

message SnapshotChunk {
  uint64 offset = 1;
  bytes data = 2;
  // Set on the last chunk, which carries no data: the position the snapshot corresponds to, and
  // the stream's checksum (XXH3-128 over every chunk's data, big-endian). An interrupted transfer
  // restarts from offset 0.
  optional bytes position = 3;
  optional bytes checksum = 4;
  // On the last chunk: the primary's hash chain at `position` (FR-044), which the follower's
  // chain continues from. Unset by a primary that predates the field.
  optional bytes chain = 5;
}

// ---- Database (v0.1 only; the router replaces it) ---------------------------------------------

// Every data node serves it. A node that doesn't hold a database's lease answers UNAVAILABLE and
// names the primary as `host:port` in the `fleetring-primary` metadata entry.
service Database {
  // Scope: write on the database.
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  // Scope: read on the database.
  rpc Query(QueryRequest) returns (QueryResponse);
  // Makes the receiving node the primary of a database the control plane has created but not
  // leased yet: it takes the first lease and creates the database. Repeating it on the primary
  // is harmless.
  // Scope: admin on the database.
  rpc Create(CreateRequest) returns (CreateResponse);
  // What this node knows on its own, without asking the control plane: its membership epoch and
  // ring fingerprint, and the databases it serves with their roles.
  // Scope: read or stream per database listed, or fleet.
  rpc NodeStatus(NodeStatusRequest) returns (NodeStatusResponse);
  // The leases this node holds, as the node itself sees them (FR-042): first every database it
  // serves with its epoch (`HeldLeases`), then one event per lease gained or lost, in the order the
  // node records them. A lease is gained before the node acknowledges a write under its epoch,
  // and lost before the node stops answering for the database. A subscriber that falls behind
  // gets RESOURCE_EXHAUSTED and opens the stream again, which starts with the leases held then.
  // Scope: read per database listed, or fleet.
  rpc WatchLeases(WatchLeasesRequest) returns (stream LeaseUpdate);
  // This node's hash chain over a database's replication log at a position (FR-044), read back
  // from its copy, so that an operator can compare every replica's. Any replica answers.
  // Scope: read on the database, or fleet.
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  // Builds a new database from an archive (FR-049): the database must exist in the control plane,
  // unleased, and the receiving node must be in its replica set. The node restores the archived
  // `source` into its own copy, verifying every batch against the hash chain, takes the first
  // lease, and serves it; followers seed from it. The handler also requires admin on `source`.
  // A node runs one restore or verification at a time; another gets UNAVAILABLE.
  // Scope: admin on the database.
  rpc Restore(RestoreRequest) returns (RestoreResponse);
  // What an archive holds for a database: its snapshots and how far its segments reach.
  // Scope: read on the database, or fleet.
  rpc DescribeArchive(DescribeArchiveRequest) returns (DescribeArchiveResponse);
  // Restores an archived database into a scratch directory, verifying every batch against the
  // hash chain, and discards it. It costs the node a whole copy on its disk, so it needs admin,
  // as a restore does, and a node runs one verification or restore at a time; another gets
  // UNAVAILABLE, which a retry settles.
  // Scope: admin on the database.
  rpc VerifyArchive(VerifyArchiveRequest) returns (VerifyArchiveResponse);
}

message RestoreLatest {}

// What a restore rebuilds.
message RestorePoint {
  oneof point {
    // The furthest point a walk of the archive's segments reaches, preferring the newest epoch.
    RestoreLatest latest = 1;
    // Exactly the log up to a position, which must be a transaction boundary.
    bytes position = 2;
    // Every segment archived at or before a time: milliseconds since the Unix epoch, by the
    // archiving nodes' clocks. A time selects which acknowledged prefix to restore, nothing more.
    uint64 time_ms = 3;
  }
}

message RestoreRequest {
  // The new database.
  string database = 1;
  // The `[[archive]]` entry's name.
  string archive = 2;
  // The archived database to restore from.
  string source = 3;
  // Unset for the latest point.
  RestorePoint point = 4;
}

message RestoreResponse {
  Placement placement = 1;
  // The position the new database starts at; empty for the log's beginning.
  bytes position = 2;
  // The 32-byte hash chain at `position`, verified over every batch applied.
  bytes chain_hash = 3;
  // The snapshot the restore started from.
  string snapshot = 4;
  // How many segments it applied.
  uint32 segments = 5;
  // When the last segment applied was archived; unset if the restore applied no segment.
  optional uint64 archived_at_ms = 6;
}

message DescribeArchiveRequest {
  string database = 1;
  string archive = 2;
}

message ArchivedSnapshot {
  string id = 1;
  uint64 epoch = 2;
  bytes position = 3;
  uint64 taken_at_ms = 4;
  uint64 bytes = 5;
}

message DescribeArchiveResponse {
  string database = 1;
  // The complete snapshots, oldest first.
  repeated ArchivedSnapshot snapshots = 2;
  // The furthest position a snapshot or segment reaches, and when its last segment was archived.
  bytes latest = 3;
  optional uint64 latest_ms = 4;
  uint32 segments = 5;
  uint64 segment_bytes = 6;
  // Objects a restore won't use: incomplete snapshots, and objects that don't read back as what
  // their names say.
  uint32 incomplete = 7;
  repeated string damaged = 8;
}

message VerifyArchiveRequest {
  string database = 1;
  string archive = 2;
  // Unset for the latest point.
  RestorePoint point = 3;
}

message VerifyArchiveResponse {
  bytes position = 1;
  bytes chain_hash = 2;
  string snapshot = 3;
  uint32 segments = 4;
}

message WatchLeasesRequest {}

// One message of a `WatchLeases` stream: the leases held when it opens, or a change since.
message LeaseUpdate {
  oneof update {
    HeldLeases held = 1;
    LeaseEvent event = 2;
  }
}

// Every lease the node holds when the stream opens, in database name order.
message HeldLeases {
  string node_id = 1;
  repeated HeldLease leases = 2;
}

message HeldLease {
  string database = 1;
  uint64 epoch = 2;
}

enum LeaseEventKind {
  LEASE_EVENT_KIND_UNSPECIFIED = 0;
  // The node started serving the database at `epoch`.
  LEASE_EVENT_KIND_GAINED = 1;
  // The node stopped serving the database; `epoch` is the epoch that ended.
  LEASE_EVENT_KIND_LOST = 2;
}

message LeaseEvent {
  string database = 1;
  uint64 epoch = 2;
  LeaseEventKind kind = 3;
}

message VerifyRequest {
  string database = 1;
  // The position to report the chain at; empty for the latest this replica holds.
  bytes position = 2;
}

message VerifyResponse {
  string database = 1;
  // The epoch of the primary that wrote the last frames of this replica's log.
  uint64 epoch = 2;
  // The position the chain hash is at; empty for an empty log.
  bytes position = 3;
  // The 32-byte BLAKE3 chain hash at `position`.
  bytes chain_hash = 4;
}

message NodeStatusRequest {}

message NodeStatusResponse {
  string node_id = 1;
  uint64 membership_epoch = 2;
  // Unset while the node has no ring.
  optional uint64 ring_fingerprint = 3;
  // The databases this node is primary for or follows, in name order.
  repeated DatabaseStatus databases = 4;
  // Each change sink's progress on each database this node feeds it, in sink and database
  // order (FR-039).
  repeated ChangeSinkStatus sinks = 5;
}

// One change sink's progress on one database.
message ChangeSinkStatus {
  string sink = 1;
  string database = 2;
  // The last position the sink took; empty if none yet.
  bytes position = 3;
  // The write quorum's position; empty if it holds no batch yet.
  bytes acknowledged = 4;
  // Batches published since the sink's position, as far as the primary knows.
  uint64 backlog = 5;
  // Deliveries that failed and were retried.
  uint64 failures = 6;
  // Times the log moved past the sink's position, so the stream skipped ahead.
  uint64 resets = 7;
  // The last delivery failure's reason; empty if none.
  string last_error = 8;
  // Set when the sink's position is kept in the database and replicates with it (FR-041); unset
  // when it is kept on this node only, or by a node that predates the field.
  bool replicated = 9;
}

message Value {
  oneof value {
    bool null = 1;
    sint64 integer = 2;
    double real = 3;
    string text = 4;
    bytes blob = 5;
  }
}

message ExecuteRequest {
  string database = 1;
  string sql = 2;
  repeated Value params = 3;
}

message ExecuteResponse {
  uint64 rows_affected = 1;
  uint32 acknowledged_by = 2;
  bool under_replicated = 3;
  // The size of the database's replica set.
  uint32 replicas = 4;
  // The primary that acknowledged the write, and the epoch it serves at.
  string primary = 5;
  uint64 epoch = 6;
}

message QueryRequest {
  string database = 1;
  string sql = 2;
  repeated Value params = 3;
}

message Row {
  repeated Value values = 1;
}

message QueryResponse {
  repeated string columns = 1;
  repeated Row rows = 2;
}

message CreateRequest {
  string database = 1;
}

message CreateResponse {
  Placement placement = 1;
}
