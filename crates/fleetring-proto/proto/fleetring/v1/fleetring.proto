// The wire contract between FleetRing nodes (ADR-0019). Fields evolve compatibly under protobuf's
// rules; a breaking change gets a new package version and a new major protocol version.
//
// Log positions and batch payloads are opaque bytes that only engine adapters interpret
// (ADR-0016). Positions compare lexicographically in log order.
syntax = "proto3";

package fleetring.v1;

// The protocol version a peer speaks. Peers exchange it at Join; a node refuses another major.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

// A node's identity and placement attributes, and the address its peers reach it at.
message Node {
  string id = 1;
  optional string zone = 2;
  optional string host = 3;
  uint32 weight = 4;
  // `host:port`. Not a placement attribute. Unset by nodes older than this field.
  optional string address = 5;
}

// What a node runs (ADR-0038): its release, and the newest protocol, control-log format, and
// fleet features it speaks. A node that sends none is taken to run 0.3.0: protocol 1.0,
// control-log format 1, and no features.
message Software {
  // The release, `MAJOR.MINOR.PATCH` with an optional prerelease, as `fleetringd --version`
  // prints it.
  string version = 1;
  ProtocolVersion protocol = 2;
  // The newest `control.db` format the node reads.
  uint32 control_format = 3;
  // The fleet features the node can apply and act on, by name, such as `undrain`. A command that
  // needs a feature is refused until every member lists it; names a node doesn't know are
  // ignored.
  repeated string features = 4;
}

// The storage engine behind a database (ADR-0021).
enum Engine {
  ENGINE_UNSPECIFIED = 0;
  ENGINE_SQLITE = 1;
}

// How many replicas must store a write before it is acknowledged (ADR-0023). Unspecified means
// the fleet's default in a request, and `quorum` from a control node that predates the field.
enum Acks {
  ACKS_UNSPECIFIED = 0;
  // A majority: W = floor(R/2) + 1.
  ACKS_QUORUM = 1;
  // Every replica: W = R. One replica down blocks writes.
  ACKS_ALL = 2;
  // The primary alone: W = 1. A failover may lose acknowledged writes.
  ACKS_LOCAL = 3;
}

// A replica's role: whether the node that reports it is the database's primary or a follower.
enum ReplicaRole {
  REPLICA_ROLE_UNSPECIFIED = 0;
  REPLICA_ROLE_PRIMARY = 1;
  REPLICA_ROLE_FOLLOWER = 2;
}

// ---- Control ----------------------------------------------------------------------------------

// Every RPC states, in a `Scope:` line, what its caller needs (ADR-0025): `node` (a node
// certificate; principals are refused), `fleet` (a node, or a principal with the `fleet`
// scope), an action on the database the request names, or, for a listing, the action on each
// database it shows; a fork also needs `fork` on its source, and a fork operation's status goes
// only to its requester or to `admin` on its target (ADR-0046). A node call also states, in a `Binding:` line, what the calling node must
// be for the database or node the request names (ADR-0031): `self` (the request names the
// caller), `replica` (in the database's replica set), `holder` (it holds the database's lease),
// `candidate` (the candidate of the promotion to the request's epoch), `holder or candidate`
// (either, at the stream's epoch), or `follower` (one the primary streams the database to). A
// call that fails its binding is refused with PERMISSION_DENIED and `fleetring-binding`
// metadata naming the binding. `fleetringd::auth::RPCS` holds the same table, and tests keep
// the two equal; a request for an RPC the table doesn't list is refused.

service Control {
  // Scope: node.
  // Binding: self.
  rpc Join(JoinRequest) returns (JoinResponse);
  // Scope: node.
  // Binding: self.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Scope: fleet.
  rpc WatchMembership(WatchMembershipRequest) returns (stream MembershipUpdate);
  // Scope: admin on the database.
  rpc CreateDatabase(CreateDatabaseRequest) returns (CreateDatabaseResponse);
  // Removes a database for good: its record, lease, and any promotion. The control node tells
  // its replicas through `Replication.DropCopy`, and each closes and deletes its copy; one that
  // misses the notice keeps its copy as an orphan (ADR-0042). `Locate` answers NOT_FOUND from
  // then on.
  // Scope: admin on the database.
  rpc DropDatabase(DropDatabaseRequest) returns (DropDatabaseResponse);
  // Records new durability settings for a database, which take effect at its next lease
  // (ADR-0023).
  // Scope: admin on the database.
  rpc ChangeDurability(ChangeDurabilityRequest) returns (ChangeDurabilityResponse);
  // Scope: read on the database, or fleet.
  rpc Locate(LocateRequest) returns (LocateResponse);
  // Every database's placement, in name order.
  // Scope: read per database listed, or fleet.
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse);
  // Scope: node.
  // Binding: self.
  rpc AcquireLease(AcquireLeaseRequest) returns (LeaseResponse);
  // Scope: node.
  // Binding: self.
  rpc RenewLease(RenewLeaseRequest) returns (LeaseResponse);
  // Removes a member, as a node does when it shuts down gracefully.
  // Scope: fleet.
  // Binding: self.
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  // The promotion calls (ADR-0018): the control node starts a promotion once a lease has
  // expired by the failover margin and tells the candidate, which fences replicas, records each
  // one, and completes the promotion.
  // Scope: node.
  // Binding: replica.
  rpc StartPromotion(StartPromotionRequest) returns (PromotionResponse);
  // Scope: node.
  // Binding: candidate.
  rpc RecordFenced(RecordFencedRequest) returns (RecordFencedResponse);
  // Scope: node.
  // Binding: candidate.
  rpc CompletePromotion(CompletePromotionRequest) returns (CompletePromotionResponse);
  // Clears a member's draining mark, so that it may take leases again without a restart. A fleet
  // feature (`undrain`): refused with FAILED_PRECONDITION until every member supports it. An
  // operator's call: nodes never make it.
  // Scope: fleet.
  rpc Undrain(UndrainRequest) returns (UndrainResponse);
  // Marks a member as draining: it gets no new lease and is never a promotion's candidate. The
  // member sees the mark in its membership updates and hands its leases over with
  // TransferLease, then leaves if it is shutting down.
  // Scope: fleet.
  // Binding: self.
  rpc Drain(DrainRequest) returns (DrainResponse);
  // Hands a database's lease from its draining holder to a follower without waiting for the
  // lease to expire: starts a promotion at the next epoch whose candidate is the named target,
  // or the most advanced live follower. The candidate completes it as after an expiry.
  // Scope: admin on the database.
  // Binding: holder.
  rpc TransferLease(TransferLeaseRequest) returns (PromotionResponse);
  // Adds a bearer token, every token a signing key issued, or every token naming a principal or
  // a name below it, to the denylist every node checks before it trusts a token (ADR-0025,
  // ADR-0047 point 11). Data nodes learn the list from their heartbeat replies, so a revocation
  // reaches every live node within one heartbeat interval. With `fleet` the caller revokes
  // anything. Without it, an agent revokes under the ancestor rule, on a direct connection:
  // the token it presented, itself, or a delegation recorded below it or that delegation's
  // principal, never a key; a relay-carried token may revoke only its own ID. A principal, and
  // any revocation under the ancestor rule, needs the `delegation` fleet feature.
  // Scope: fleet, or the ancestor rule.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);
  // Creates a database with a description, labels, or an expiry (ADR-0041); needs the
  // `metadata` fleet feature, and `expiry` too for an expiry, and refuses a request without
  // metadata. A control node that predates it answers UNIMPLEMENTED, so a creation never loses
  // its metadata to an older node. The control node records the caller as the creator.
  // Scope: admin on the database.
  rpc CreateDatabaseWithMetadata(CreateDatabaseWithMetadataRequest) returns (CreateDatabaseResponse);
  // Changes a database's description, labels, or expiry with a patch; needs the `metadata`
  // fleet feature, and `expiry` too for a change to the expiry. The control node records the
  // caller as the description's author when the description changes.
  // Scope: admin on the database.
  rpc UpdateDatabase(UpdateDatabaseRequest) returns (UpdateDatabaseResponse);
  // Creates `database` as a copy of `source` (ADR-0046): the control plane records the fork,
  // which starts `seeding`, and answers at once with its operation's status. The operation ID the
  // client chose makes a resend safe: the same requester sending the same request again gets the
  // same operation back, and nothing changes. Needs the `fork` fleet feature, and `metadata`,
  // and `expiry` for an expiry. A control node that predates forks answers UNIMPLEMENTED.
  // Scope: admin on the database, and fork on `source`.
  rpc ForkDatabase(ForkDatabaseRequest) returns (ForkOperationStatus);
  // A fork operation's status, while the operation is pending and for its retention after it
  // ends (ADR-0046, point 5.4). An operation the caller may not see answers NOT_FOUND, exactly as
  // an unknown one does.
  // Scope: the requesting principal, or admin on the target.
  rpc GetForkOperation(GetForkOperationRequest) returns (ForkOperationStatus);
  // Mints a delegated agent's token (ADR-0047, point 5): the control plane records the
  // delegation, the child's complete claims and its lineage, then signs exactly those claims
  // with its delegation issuer's key. The caller is an agent whose token reached the control
  // node directly, on a connection whose certificate names the caller or an ancestor of it,
  // never through a relay. The operation ID the caller chose makes a resend safe: the same
  // principal sending the same request again gets the same delegation, signed again, and
  // nothing new is recorded. Needs the `delegation` fleet feature. The token never reaches a
  // log. A control node that predates it answers UNIMPLEMENTED.
  // Scope: an agent's token whose grant covers the child (checked in the handler).
  rpc DelegateToken(DelegateTokenRequest) returns (DelegateTokenResponse);
  // Lists live delegation records, never tokens, for incident response (ADR-0047, point 6.4).
  // Scope: fleet.
  rpc ListDelegations(ListDelegationsRequest) returns (ListDelegationsResponse);
}

message JoinRequest {
  ProtocolVersion protocol = 1;
  Node node = 2;
  // Unset by nodes older than this field, which run 0.3.0. A join whose release is more than one
  // release line from a member's, or that lacks a feature the fleet has enabled, is refused with
  // FAILED_PRECONDITION.
  Software software = 3;
}

message JoinResponse {
  ProtocolVersion protocol = 1;
  uint64 membership_epoch = 2;
  // Every revoked token and signing key the control plane lists, as in `HeartbeatResponse`, so
  // a node that starts has a denylist before its first heartbeat. Empty from a control node that
  // predates the field.
  repeated Revocation revocations = 3;
}

message DatabaseStatus {
  string database = 1;
  ReplicaRole role = 2;
  // The epoch of the primary that wrote the last frames of this replica's log: the primary's
  // own epoch on a primary. Promotions rank logs by it before their positions.
  uint64 epoch = 3;
  bytes position = 4;
  // What the replica says about a fork of this name (ADR-0046, point 4.5). Each names the fork
  // identity it is about, `(database, fork_incarnation, operation)`, and the control plane
  // ignores one for another identity. Unset by nodes that predate forks, and recorded only once
  // the fleet has enabled `fork`.
  //
  // The replica durably holds a staged copy of the fork, at log epoch 0.
  StagedCopy staged = 5;
  // The replica's staged copy is missing or damaged.
  CopyLost copy_lost = 6;
  // The replica couldn't seed the fork in an attempt.
  SeedFailure seed_failure = 7;
  // How the fork-reset write stands on this replica.
  ForkReset reset = 8;
  // How far the replica has streamed a copy, for status only: nothing is decided by it.
  SeedProgress seed_progress = 9;
  // The bytes the replica's copy of the database takes on disk, for fork admission (ADR-0046,
  // point 7.3). Unset if the node doesn't say.
  optional uint64 size_bytes = 10;
  // On a ready fork's primary whose recorded holders are still its replica set: placement's
  // write quorum holds its whole log, and it counts both write quorums toward every write from
  // now on (ADR-0046, point 3.10, as built). The control plane then releases the holders.
  PlacementCaughtUp placement_caught_up = 11;
  // On a primary whose database's replica set a membership change kept: placement's write
  // quorum holds its whole log, and it counts both write quorums toward every write from now on
  // (ADR-0031, amendment 2). The control plane then releases the kept set. Unset by nodes that
  // predate it, and recorded only once the fleet has enabled `handover`.
  ReplicasCaughtUp replicas_caught_up = 12;
}

// A database's primary at `epoch` has placement's write quorum holding its log, while a
// membership change keeps the database's old replica set.
message ReplicasCaughtUp {
  // The database's incarnation.
  fixed64 incarnation = 1;
  // The lease epoch of the primary that reports it.
  uint64 epoch = 2;
  // The membership epoch of the ring whose placement the primary checked: the one `Placement`
  // named beside the placed replicas it counts. The control plane releases the kept set only
  // while it is the current one. A report without it is ignored.
  optional uint64 membership_epoch = 3;
}

// A ready fork's primary at `epoch` has placement's write quorum holding its log.
message PlacementCaughtUp {
  fixed64 fork_incarnation = 1;
  bytes operation = 2;
  // The lease epoch of the primary that reports it.
  uint64 epoch = 3;
  // The membership epoch of the ring whose placement the primary checked. The control plane
  // releases the holders only while it is the current one. A report without it is ignored.
  optional uint64 membership_epoch = 4;
}

// A replica durably holds a staged copy of a fork: written, verified, synced, and renamed into
// place (ADR-0046, point 4.3).
message StagedCopy {
  // The fork's incarnation: 64 bits, printed as 16 lowercase hex digits.
  fixed64 fork_incarnation = 1;
  // The fork's operation ID: 16 bytes, printed as 26 lowercase base32 characters.
  bytes operation = 2;
  // The attempt that fetched the copy, from 1.
  uint32 attempt = 3;
  // The source position the copy holds, and its chain hash there.
  bytes position = 4;
  bytes chain_hash = 5;
  // The source incarnation the source's primary stamped on the stream.
  fixed64 source_incarnation = 6;
}

// Why a staged copy is lost.
enum CopyLossReason {
  COPY_LOSS_REASON_UNSPECIFIED = 0;
  // The staged file or its sidecar is missing.
  COPY_LOSS_REASON_MISSING = 1;
  // The staged file fails its size, position, or checksum check.
  COPY_LOSS_REASON_DAMAGED = 2;
}

// A holder found its staged copy of a fork missing or damaged (ADR-0046, points 4.5 and 6.2).
message CopyLost {
  fixed64 fork_incarnation = 1;
  bytes operation = 2;
  uint32 attempt = 3;
  CopyLossReason reason = 4;
}

// Why a replica couldn't seed a fork.
enum SeedFailureReason {
  SEED_FAILURE_REASON_UNSPECIFIED = 0;
  // The replica hasn't room for the copy (ADR-0046, point 7.2).
  SEED_FAILURE_REASON_INSUFFICIENT_DISK = 1;
  // The source can't be copied within its pin limits.
  SEED_FAILURE_REASON_SOURCE_TOO_LARGE = 2;
  // The source's primary can't seed the source's engine.
  SEED_FAILURE_REASON_ENGINE_UNSUPPORTED = 3;
  // The transfer broke after the replica's own retries.
  SEED_FAILURE_REASON_TRANSFER_FAILED = 4;
  // The source's pin expired before the transfer finished.
  SEED_FAILURE_REASON_PIN_EXPIRED = 5;
}

// A replica couldn't seed a fork in one attempt.
message SeedFailure {
  fixed64 fork_incarnation = 1;
  bytes operation = 2;
  uint32 attempt = 3;
  SeedFailureReason reason = 4;
  // Whether another attempt may succeed. A control node judges a reason it knows by the reason
  // itself; it reads this only for a reason it doesn't know.
  bool retryable = 5;
}

// A fork's reset write on a replica (ADR-0046, point 6): on the primary, `committed` means its
// commit index at the bootstrap quorum covers the marker; on a follower, that the marker is in
// its durable log. Unset `committed` means the primary is running it.
message ForkReset {
  fixed64 fork_incarnation = 1;
  bytes operation = 2;
  // The lease epoch of the primary that wrote the reset.
  uint64 epoch = 3;
  // The reset write's position in the fork's own log.
  bytes position = 4;
  bool committed = 5;
}

// How far a replica has streamed a copy of a fork.
message SeedProgress {
  fixed64 fork_incarnation = 1;
  bytes operation = 2;
  uint32 attempt = 3;
  uint64 bytes = 4;
  // The copy's size, from the stream's first chunk; 0 until it is known.
  uint64 total_bytes = 5;
}

message HeartbeatRequest {
  string node_id = 1;
  repeated DatabaseStatus databases = 2;
  // Unset by nodes older than this field. Corrects the control plane's record of the node's
  // software, as after the control node was upgraded; never a reason to refuse the heartbeat.
  Software software = 3;
  // The free bytes on the node's data volume, for the control plane's best-effort fork
  // admission (ADR-0046, point 7.3). Unset by nodes that predate forks; recorded only once the
  // fleet has enabled `fork`.
  optional uint64 disk_free_bytes = 4;
}

message HeartbeatResponse {
  uint64 membership_epoch = 1;
  // Reported databases the control plane doesn't know. Their reports were left out; the rest of
  // the heartbeat counted.
  repeated string unknown_databases = 2;
  // Every revoked token and signing key the control plane lists, in order. Empty from a control
  // node that predates the field.
  repeated Revocation revocations = 3;
  // The forks that aren't ready yet whose replica set names the node: it seeds them, or opens
  // them once seeded (ADR-0046, points 4 and 6). Empty from a control node that predates forks.
  repeated string forks = 4;
}

// A token, signing key, or principal on the denylist, and when the entry may be forgotten.
//
// From 0.8 a node that meets an entry it can't read, whose case is absent, unknown to it, or
// malformed, treats the whole list as unusable and refuses every token until it reads one
// wholly (ADR-0047, point 3).
message Revocation {
  oneof revoked {
    // A token's `jti`.
    string token_id = 1;
    // A signing key's `kid`: every token it signed.
    string key_id = 2;
    // Every token naming a principal or a name below it, issued until a time. Only the
    // control plane writes one: a `RevokeTokenRequest` holding it is refused.
    PrincipalRevocation principal = 4;
  }
  // Milliseconds since the Unix epoch; the maximum value means never.
  uint64 until_ms = 3;
}

// A principal's revocation (ADR-0047, point 11.1): it refuses every token whose subject is
// `principal` or a name below it (`agent-42` and `agent-42.c7`, never `agent-420`) and whose
// `iat` is at or before `before_ms`, with 30 seconds of leeway for a token the authority signed.
message PrincipalRevocation {
  // Another fleet's name; never set in 0.8, and a node treats an entry that sets it as
  // unreadable.
  optional string fleet = 1;
  string principal = 2;
  // The control time of the revocation, in milliseconds since the Unix epoch.
  uint64 before_ms = 3;
}

// What to revoke: a token or a key in `revocation`, a principal in `principal`, or a token
// and a principal at once, which an agent removing itself needs, since its token no longer
// authenticates a second request once either lands. The control plane revokes the principal
// first, then the token. `revocation` never holds a principal, whose `before` only the control
// plane sets, and its `until_ms` counts only with `fleet`.
message RevokeTokenRequest {
  Revocation revocation = 1;
  // A principal to revoke, or empty for none: every token naming it or a name below it, issued
  // until now. Under the ancestor rule, an agent name at or below the caller's.
  string principal = 2;
}

message RevokeTokenResponse {
  // When the entry of `revocation` will be forgotten: the later of this request's and any
  // earlier revocation's. For a request naming only a principal, its entry's.
  uint64 until_ms = 1;
  // For a request naming a principal: the control time, in milliseconds since the Unix epoch,
  // its entry refuses tokens issued at or before. A new root token may be minted 30 seconds
  // after it, by its signer's clock.
  optional uint64 before_ms = 2;
  // For a request naming a principal: when its entry will be forgotten.
  optional uint64 principal_until_ms = 3;
}

message DelegateTokenRequest {
  // 16 random bytes the caller chooses before it asks, printed as 26 lowercase base32
  // characters, as a fork's are. A resend repeats them.
  bytes operation_id = 1;
  // The child's last segment, 1 to 32 of `a-z`, `0-9`, and `_`: the child is the caller's name
  // followed by `.<segment>`.
  string segment = 2;
  // The scopes asked for, each wholly within the caller's scopes and its `grant` patterns, or
  // none for the defaults: `admin` and `stream` on `<child>-*`, narrowed to what the caller
  // holds.
  repeated string scopes = 3;
  // How long the token lasts from `not_before`: 60 seconds to 24 hours, and never past the
  // caller's token. Unset for the default, 2 hours, capped at the caller's token's expiry.
  optional uint64 lifetime_ms = 4;
  // When the token starts, in milliseconds since the Unix epoch: at most 30 seconds ago, at most
  // 24 hours ahead, and before the caller's token expires. Unset for now.
  optional uint64 not_before_ms = 5;
}

message DelegateTokenResponse {
  // The child's token. Keep it out of logs.
  string token = 1;
  // The delegation ID, the token's `jti`: 22 base64url characters. Every copy of the token, a
  // resend's included, has it, and revoking it ends them all.
  string delegation_id = 2;
  // The child's principal.
  string principal = 3;
  // The child's scopes, in canonical form.
  repeated string scopes = 4;
  // When the token starts and expires, in milliseconds since the Unix epoch, in whole seconds.
  uint64 not_before_ms = 5;
  uint64 expires_at_ms = 6;
  // Set when the default lifetime was cut short by the caller's token's expiry.
  bool capped = 7;
  // The ID of the delegation issuer key that signed this copy, the token's `kid`.
  string issuer_key_id = 8;
}

message ListDelegationsRequest {
  // Only the records this control node logged; unset for every control node's. A compromised
  // control node can stamp another's ID, so after a compromise list by time as well.
  optional string recorded_by = 1;
  // Only the records logged at or after this time, in milliseconds since the Unix epoch.
  optional uint64 recorded_from_ms = 2;
  // Only the records logged at or before this time, in milliseconds since the Unix epoch.
  optional uint64 recorded_to_ms = 3;
}

// One link of a delegated token's lineage: an ancestor's token ID, and the ID of the key that
// signed the copy of its token the delegation was made from.
message ChainLink {
  string id = 1;
  string kid = 2;
}

// A live delegation record (ADR-0047, point 6.1), never its token.
message DelegationRecord {
  string principal = 1;
  string delegation_id = 2;
  // The principal that delegated it.
  string parent = 3;
  // Its ancestors, root first, ending with the parent.
  repeated ChainLink chain = 4;
  // The token's `iat` and `exp`, in milliseconds since the Unix epoch.
  uint64 issued_at_ms = 5;
  uint64 expires_at_ms = 6;
  // The control node that logged the record, as it stamped itself: advisory after a compromise.
  string recorded_by = 7;
  // When the record was logged: the command's effective time, in milliseconds since the Unix
  // epoch.
  uint64 recorded_at_ms = 8;
}

message ListDelegationsResponse {
  // In delegation ID order.
  repeated DelegationRecord delegations = 1;
}

message WatchMembershipRequest {
  uint64 after_epoch = 1;
}

message Member {
  Node node = 1;
  bool live = 2;
  // Set while the member is draining: handing its leases over before it leaves.
  bool draining = 3;
  // What the member runs, as it last reported; unset if it reported nothing, as 0.3.0 doesn't,
  // or if the control node predates the field.
  Software software = 4;
}

message MembershipUpdate {
  uint64 membership_epoch = 1;
  repeated Member members = 2;
  // The fleet features the fleet has enabled for good, by name (ADR-0038): a node whose release
  // lacks one can't join, so `fleetringd upgrade` refuses to install such a release. Empty from a
  // control node that predates the field.
  repeated string features = 3;
  // Set when the control node runs in dev mode (ADR-0039): one node on loopback with a local
  // authority, for development only. Unset by a control node that predates the field.
  bool dev_mode = 4;
}

message CreateDatabaseRequest {
  string database = 1;
  // Replicas, the primary included; 0 for the fleet's default, which the control node fills in
  // before it logs the creation. Control nodes before 0.5.0 refuse 0.
  uint32 replication_factor = 2;
  Engine engine = 3;
  // The acknowledgement mode; unspecified for the fleet's default.
  Acks acks = 4;
  // The floor on reachable replicas, the primary included, below which writes are refused;
  // 0 for the default, the mode's write quorum W.
  uint32 min_replicas = 5;
}

message ChangeDurabilityRequest {
  string database = 1;
  Acks acks = 2;
  // 0 for the mode's write quorum W.
  uint32 min_replicas = 3;
}

message ChangeDurabilityResponse {
  // The settings that take effect at the next lease.
  Acks acks = 1;
  uint32 min_replicas = 2;
  // The settings in effect until then.
  Acks current_acks = 3;
  uint32 current_min_replicas = 4;
}

message CreateDatabaseResponse {
  Placement placement = 1;
}

message DropDatabaseRequest {
  string database = 1;
}

message DropDatabaseResponse {
  // The epoch the database was at when it was dropped.
  uint64 epoch = 1;
}

message LocateRequest {
  string database = 1;
}

// Every filter is optional; a control node that predates them ignores them and lists every
// database the caller may read, so a client applies them again to the reply.
message ListDatabasesRequest {
  // Label requirements, all of which must hold: "key=value", or "key" for "has the key".
  repeated string labels = 1;
  // Only databases whose names start with this.
  string prefix = 2;
  // Include each database's description text; listings leave it out by default.
  bool descriptions = 3;
  // Only databases after this name, exclusive, in name order: `next_after` of an earlier page.
  string after = 4;
  // At most this many databases; 0 for no limit.
  uint32 limit = 5;
}

message ListDatabasesResponse {
  repeated Placement databases = 1;
  // The last name listed, when more databases follow it; empty when nothing follows.
  string next_after = 2;
}

message LocateResponse {
  Placement placement = 1;
}

message Placement {
  string database = 1;
  Engine engine = 2;
  uint64 epoch = 3;
  // The lease holder, which serves writes at `epoch`. Unset before the first lease and while a
  // promotion to `epoch` is in progress.
  optional string primary = 4;
  repeated string followers = 5;
  // The whole replica set in the ring's preference order, the primary included.
  repeated Replica replicas = 6;
  // How many replicas the database should have. The replica set is smaller while there are
  // fewer members. 0 from a control node that predates the field.
  uint32 replication_factor = 7;
  // The durability settings in effect (ADR-0023). Unspecified and 0 from a control node that
  // predates the fields, which means `quorum` with the floor at W.
  Acks acks = 8;
  uint32 min_replicas = 9;
  // The node carrying out the promotion to `epoch`, while one is in progress (FR-050). Unset
  // otherwise, and from a control node that predates the field.
  optional string candidate = 10;
  // The database's metadata (ADR-0041). Unset for a database without any, and from a control
  // node that predates the field.
  DatabaseMetadata metadata = 11;
  // The database's incarnation (ADR-0046, point 1): 64 random bits naming this life of its name,
  // printed as 16 lowercase hex digits. 0 for a database created before the fleet enabled
  // `fork`, and from a control node that predates the field.
  fixed64 incarnation = 12;
  // The fork that made the database, its state and provenance. Unset for a database no fork
  // made, and from a control node that predates forks.
  ForkStatus fork = 13;
  // Where the ring at `membership_epoch` places the database, in preference order. It differs
  // from `replicas` while a seeded fork's recorded holders, a ready fork's kept holders, or a
  // replica set a membership change kept are the replica set promotions fence (ADR-0031,
  // amendment 2): a primary then counts the write quorums of both. Empty from a control node
  // that predates the field.
  repeated string placed_replicas = 14;
  // The membership epoch of the control state this placement was read from. Unset from a
  // control node that predates it, whose primaries count placement by their own ring.
  optional uint64 membership_epoch = 15;
}

// How far a fork has got (ADR-0046, point 2). `cancelled` appears only in an operation's
// status: a fork dropped or expired before it was ready.
enum ForkState {
  FORK_STATE_UNSPECIFIED = 0;
  // An attempt is copying the source.
  FORK_STATE_SEEDING = 1;
  // A completion quorum holds the copy; the fork-reset write hasn't been recorded yet, so the
  // fork serves no client.
  FORK_STATE_SEEDED = 2;
  // The fork-reset write is committed: the fork is an ordinary database.
  FORK_STATE_READY = 3;
  // The fork failed for good; `db drop` removes it.
  FORK_STATE_FAILED = 4;
  // The fork was dropped, or expired, before it was ready.
  FORK_STATE_CANCELLED = 5;
}

// Why a fork failed. A later release may add a reason: a client treats an unknown one as a
// failure.
enum ForkFailureReason {
  FORK_FAILURE_REASON_UNSPECIFIED = 0;
  FORK_FAILURE_REASON_SOURCE_GONE = 1;
  FORK_FAILURE_REASON_SOURCE_RECREATED = 2;
  FORK_FAILURE_REASON_RETRIES_EXHAUSTED = 3;
  FORK_FAILURE_REASON_DEADLINE_EXCEEDED = 4;
  FORK_FAILURE_REASON_SOURCE_TOO_LARGE = 5;
  FORK_FAILURE_REASON_INSUFFICIENT_DISK = 6;
  FORK_FAILURE_REASON_ENGINE_UNSUPPORTED = 7;
}

// Why a fork's attempt ended and another began.
enum RetryCause {
  RETRY_CAUSE_UNSPECIFIED = 0;
  RETRY_CAUSE_SEEDER_DOWN = 1;
  RETRY_CAUSE_ATTEMPT_TIMED_OUT = 2;
  RETRY_CAUSE_TRANSFER_FAILED = 3;
  RETRY_CAUSE_PIN_EXPIRED = 4;
  RETRY_CAUSE_HOLDER_LOST = 5;
  RETRY_CAUSE_HOLDERS_LEFT = 6;
  RETRY_CAUSE_SEEDER_DISK_REFUSED = 7;
}

// Why a fork that wasn't ready was removed.
enum ForkCancelCause {
  FORK_CANCEL_CAUSE_UNSPECIFIED = 0;
  // `db drop`.
  FORK_CANCEL_CAUSE_DROPPED = 1;
  // Its expiry passed.
  FORK_CANCEL_CAUSE_EXPIRED = 2;
}

// Why a fork failed, the cause of its last retry, and how many attempts it made.
message ForkFailure {
  ForkFailureReason reason = 1;
  // For `retries_exhausted` and `deadline_exceeded`; unspecified otherwise.
  RetryCause last_cause = 2;
  // 0 when the control plane no longer knows it, as after the fork was dropped.
  uint32 attempts = 3;
}

// A fork's record in a placement (ADR-0046, point 2). A field that doesn't apply in the state
// is unset, or empty.
message ForkStatus {
  ForkState state = 1;
  // The operation that made the fork: 16 bytes, printed as 26 lowercase base32 characters.
  bytes operation_id = 2;
  string source = 3;
  // The source's incarnation the fork copies.
  fixed64 source_incarnation = 4;
  // The current attempt while seeding, the attempt that fetched the copy once seeded or ready,
  // and the attempts made once failed.
  uint32 attempt = 5;
  // The most attempts the fork makes.
  uint32 max_attempts = 6;
  // While seeding: the attempt's seeder, the replicas passed over as seeders, and those that
  // refused the copy for want of disk.
  optional string seeder = 7;
  repeated string seeder_excluded = 8;
  repeated string disk_refused = 9;
  // While seeding, the replicas that reported the attempt's staged copy; once seeded, the
  // recorded holders, which are the fork's replica set until it is ready. Empty once ready:
  // see `kept_holders`.
  repeated string holders = 10;
  // The fork's completion quorum: how many holders seeding needs.
  uint32 holders_needed = 11;
  // While seeding, the seeder's progress as it last reported it.
  optional uint64 bytes = 12;
  optional uint64 total_bytes = 13;
  // Once seeded: the source position the copy holds, and its chain hash there.
  optional bytes position = 14;
  optional bytes chain_hash = 15;
  // Once failed.
  ForkFailure failure = 16;
  // The principal that asked for the fork, if it had a name. It grants nothing.
  optional string requested_by = 17;
  uint64 requested_at_ms = 18;
  // While seeding: when the fork fails if it is still seeding.
  optional uint64 deadline_at_ms = 19;
  optional uint64 completed_at_ms = 20;
  optional uint64 ready_at_ms = 21;
  optional uint64 failed_at_ms = 22;
  // Once ready: the epoch of the primary that committed the fork-reset write, and its position.
  // While seeded, the fork-reset write the fork's current primary reports committed at its
  // bootstrap quorum, if it does: the position a follower's log must reach before the follower
  // reports the reset too (ADR-0046, point 6.2). Unset from a control node that predates it.
  optional uint64 reset_epoch = 23;
  optional bytes reset_position = 24;
  // While seeding, why the previous attempt ended; unspecified for the first.
  RetryCause last_cause = 25;
  // Once ready, the recorded holders it keeps as its replica set until they are released, or
  // none once they are (ADR-0046, point 3.10, as built). Empty in every other state.
  repeated string kept_holders = 26;
}

// A fork request (ADR-0046, point 5.2): the caller's intent, exactly as given, and the operation
// ID it chose. A resend compares everything here but the ID.
message ForkDatabaseRequest {
  // 16 random bytes the client chooses before it asks, printed as 26 lowercase base32
  // characters.
  bytes operation_id = 1;
  // The fork's name: the database to create.
  string database = 2;
  // The database to copy.
  string source = 3;
  // The source incarnation the caller requires; unset for the source's current one.
  optional fixed64 expect_source_incarnation = 4;
  // As in CreateDatabaseRequest: 0, unspecified, and 0 take the fleet's defaults, which the
  // control node fills in before it logs the fork. Nothing is copied from the source.
  uint32 replication_factor = 5;
  Acks acks = 6;
  uint32 min_replicas = 7;
  // The fork's description, labels, and expiry, as CreateDatabaseWithMetadata takes them. A
  // duration is part of the request, and is resolved to a time only when the fork is first
  // recorded, so a resend of the same duration matches it.
  MetadataSpec metadata = 8;
}

message GetForkOperationRequest {
  bytes operation_id = 1;
}

// A fork operation's record (ADR-0046, point 5.3): what the caller asked for, what it resolved
// to when it was first recorded, and its outcome.
message ForkOperationStatus {
  bytes operation_id = 1;
  // The fork's name, and the incarnation the operation made it with.
  string database = 2;
  fixed64 incarnation = 3;
  // `seeding` or `seeded` while pending; `ready`, `failed`, or `cancelled` once it ended, which
  // never changes.
  ForkState state = 4;
  string source = 5;
  // The source incarnation the operation resolved to when it was first recorded.
  fixed64 source_incarnation = 6;
  // While seeding, the current attempt.
  uint32 attempt = 7;
  // Once ready: the source position the fork holds, and its chain hash there.
  optional bytes position = 8;
  optional bytes chain_hash = 9;
  // Once failed.
  ForkFailure failure = 10;
  // Once cancelled.
  ForkCancelCause cancel_cause = 11;
  // When the outcome last changed, when it ended, and when the record, and the deduplication of
  // its ID, is forgotten.
  uint64 updated_at_ms = 12;
  optional uint64 finished_at_ms = 13;
  optional uint64 forgotten_at_ms = 14;
  // The request as first recorded, with the replication factor and durability the control node
  // filled in. `operation_id` is the operation's.
  ForkDatabaseRequest request = 15;
  // The principal that asked, if it had a name.
  optional string requested_by = 16;
  // The expiry the operation resolved to, if any.
  optional uint64 expires_at_ms = 17;
  // The fork's placement while its name holds the operation's incarnation; unset once the fork
  // is gone.
  Placement placement = 18;
}

// A database label (ADR-0041 point 1): Kubernetes key and value rules.
message Label {
  string key = 1;
  string value = 2;
}

// A database's metadata (ADR-0041). Unset in a Placement for a database without any, and from a
// control node that predates the field.
message DatabaseMetadata {
  // Empty when the database has none, or when a listing left descriptions out.
  string description = 1;
  // The principal that last set the description; unset if unknown.
  optional string description_by = 2;
  // Sorted by key.
  repeated Label labels = 3;
  optional string created_by = 4;
  optional uint64 created_at_ms = 5;
  // Milliseconds since the Unix epoch, by the control node's clock.
  optional uint64 expires_at_ms = 6;
  uint64 version = 7;
}

message MetadataSpec {
  string description = 1;
  repeated Label labels = 2;
  // When the database is dropped (ADR-0041 point 4): an absolute time, or a duration the
  // control node resolves against its time before it logs the creation. At least one minute
  // ahead; needs the `expiry` fleet feature.
  oneof expiry {
    // Milliseconds since the Unix epoch.
    uint64 expires_at_ms = 3;
    uint64 expires_in_ms = 4;
  }
}

// A creation with metadata. A new RPC rather than new CreateDatabaseRequest fields, so that a
// control node that predates it refuses it (UNIMPLEMENTED) instead of creating the database
// without the metadata (ADR-0041 point 2).
message CreateDatabaseWithMetadataRequest {
  CreateDatabaseRequest database = 1;
  MetadataSpec metadata = 2;
}

message UpdateDatabaseRequest {
  string database = 1;
  oneof description {
    string set_description = 2;
    bool clear_description = 3;
    // Sets the description with no author, whoever the caller is: a restored description
    // (ADR-0041 point 10). Readers treat it as untrusted.
    string set_description_without_author = 10;
  }
  repeated Label set_labels = 4;
  repeated string remove_labels = 5;
  // Sets or clears the expiry (ADR-0041 point 4); needs the `expiry` fleet feature. A new
  // expiry is at least one minute ahead, and a duration resolves against the control node's
  // time before the update is logged.
  oneof expiry {
    // Milliseconds since the Unix epoch.
    uint64 expires_at_ms = 6;
    uint64 expires_in_ms = 7;
    bool clear_expiry = 8;
  }
  // The update applies only if the metadata is at this version; ABORTED otherwise.
  optional uint64 if_version = 9;
}

message UpdateDatabaseResponse {
  DatabaseMetadata metadata = 1;
}

// One member of a database's replica set, as the control plane knows it.
message Replica {
  string node_id = 1;
  // `host:port`, if the member advertised one.
  optional string address = 2;
  bool live = 3;
  // What the member last reported for the database in a heartbeat, if it has.
  ReplicaRole reported_role = 4;
  optional bytes position = 5;
}

message AcquireLeaseRequest {
  string database = 1;
  string node_id = 2;
}

message RenewLeaseRequest {
  string database = 1;
  string node_id = 2;
  uint64 epoch = 3;
}

message LeaseResponse {
  string database = 1;
  uint64 epoch = 2;
  uint64 expires_at_ms = 3;
}

message LeaveRequest {
  string node_id = 1;
}

message LeaveResponse {
  uint64 membership_epoch = 1;
}

message StartPromotionRequest {
  string database = 1;
}

message PromotionResponse {
  string database = 1;
  // The promotion's new epoch.
  uint64 epoch = 2;
  string candidate = 3;
}

message RecordFencedRequest {
  string database = 1;
  string node_id = 2;
  uint64 epoch = 3;
  bytes position = 4;
}

message RecordFencedResponse {
  // How many replica-set members are fenced at the promotion's epoch, and how many must be.
  uint32 fenced = 1;
  uint32 needed = 2;
}

message CompletePromotionRequest {
  string database = 1;
  uint64 epoch = 2;
}

message CompletePromotionResponse {
  LeaseResponse lease = 1;
  // The most advanced position among the fenced members, as the control plane compares them.
  bytes adopted = 2;
}

message UndrainRequest {
  string node_id = 1;
}

message UndrainResponse {}

message DrainRequest {
  string node_id = 1;
}

message DrainResponse {
  // The databases the member holds the lease on, in name order: what it has to hand over.
  repeated string primaries = 1;
}

message TransferLeaseRequest {
  string database = 1;
  // The replica to hand the lease to, or empty to let the control plane pick the most advanced
  // live follower.
  string target = 2;
}

// ---- Replication ------------------------------------------------------------------------------

service Replication {
  // The primary opens one stream per follower and sends batches; the follower acknowledges.
  // Scope: node.
  // Binding: holder or candidate.
  rpc Replicate(stream ReplicateMessage) returns (stream ReplicateAck);
  // A promotion fences a replica at a new epoch and learns its position (ADR-0018).
  // Scope: node.
  // Binding: candidate.
  rpc Fence(FenceRequest) returns (FenceResponse);
  // A request that names a fork seeds it (ADR-0046, point 4), under the `seeding` binding: the
  // caller is the attempt's seeder, asking the source's primary, or a replica of the fork,
  // asking the seeder for its staged copy.
  // Scope: node.
  // Binding: follower or seeding.
  rpc Snapshot(SnapshotRequest) returns (stream SnapshotChunk);
  // A candidate fetches the frames it lacks from the most advanced fenced member.
  // Scope: node.
  // Binding: candidate.
  rpc Fetch(FetchRequest) returns (FetchResponse);
  // The control node asks a promotion's candidate to carry it out.
  // Scope: node.
  // Binding: candidate.
  rpc Promote(PromoteRequest) returns (PromoteResponse);
  // The control node that dropped or expired a database tells each replica, so that it deletes
  // its copy (ADR-0042). The replica deletes its copy only if the epoch is the copy's own
  // highest epoch, and control state no longer holds the database at that epoch.
  // Scope: node.
  // Binding: dropped.
  rpc DropCopy(DropCopyRequest) returns (DropCopyResponse);
}

message ReplicateMessage {
  oneof message {
    ReplicateOpen open = 1;
    Batch batch = 2;
    CheckpointMarker checkpoint = 3;
    Reseed reseed = 4;
  }
}

message ReplicateOpen {
  string database = 1;
  uint64 epoch = 2;
  // Where this epoch's log begins: the position its primary adopted when it was promoted. A
  // follower whose log came from an earlier epoch and runs past it truncates back to it first.
  // Unset for an epoch that started with the database.
  optional bytes epoch_start = 3;
  // The primary's hash chain at `epoch_start` (FR-044). A follower at `epoch_start` whose chain
  // no record fits, as after it truncated a tail back there, takes this hash, so its chain
  // agrees with the primary's before the next batch. Unset with `epoch_start`, when the
  // primary's chain doesn't hold it, or by a primary that predates the field.
  optional bytes epoch_start_chain = 4;
}

// One or more committed transactions, as the engine encodes them.
message Batch {
  uint64 epoch = 1;
  bytes start = 2;
  bytes end = 3;
  bytes payload = 4;
  // The sender's hash chain at `end` (FR-044): BLAKE3 over each transaction in turn, each
  // folding in the hash before it. A follower recomputes it over the batch and refuses one
  // that doesn't match. Unset by a sender that predates the field.
  optional bytes chain = 5;
}

message CheckpointMarker {
  uint64 epoch = 1;
  bytes position = 2;
}

// The log no longer holds what the follower needs: it replaces its copy with a snapshot fetched
// through `Snapshot`, then acknowledges the snapshot's position.
message Reseed {
  uint64 epoch = 1;
}

message ReplicateAck {
  bytes position = 1;
  // Set when the follower's copy, at `position`, can't follow this epoch's log: on the first
  // acknowledgement, when it diverges before a point it can be cut back to, or later, when the
  // primary's frames don't continue it. The position isn't on the primary's log. The primary
  // answers with `Reseed`, and the follower takes no frames until it has.
  bool needs_snapshot = 2;
}

message FenceRequest {
  string database = 1;
  uint64 epoch = 2;
  // The node being promoted at `epoch`, the only one whose stream the replica accepts at it.
  // Empty from a caller that predates the field.
  string candidate = 3;
}

message FenceResponse {
  uint64 epoch = 1;
  bytes position = 2;
  // The epoch of the primary that wrote the last frames of the replica's log.
  uint64 log_epoch = 3;
}

message FetchRequest {
  string database = 1;
  // The promotion's epoch, at which the replica must already be fenced.
  uint64 epoch = 2;
  // The position the caller holds; empty for an empty log.
  bytes after = 3;
}

message FetchResponse {
  // Every committed transaction after `after`, or unset if there is none.
  optional Batch batch = 1;
  // The epoch of the primary that wrote the last frames of the replica's log.
  uint64 log_epoch = 2;
  // The replica's hash chain at the batch's end, or at `after` if there is no batch (FR-044).
  // Unset by a replica that predates the field, or whose chain doesn't reach there.
  optional bytes chain = 3;
}

message PromoteRequest {
  string database = 1;
  uint64 epoch = 2;
  uint32 replication_factor = 3;
}

message PromoteResponse {}

message DropCopyRequest {
  string database = 1;
  // The epoch the database was at when it was dropped.
  uint64 epoch = 2;
  // The dropped database's incarnation and, for a fork, its operation ID: a seeding fork's epoch
  // is 0, so the epoch alone can't name it (ADR-0046, point 4.6). A staged copy is deleted only
  // on a notice naming its own identity. Unset by control nodes that predate forks.
  optional fixed64 incarnation = 3;
  optional bytes operation = 4;
}

message DropCopyResponse {}

message SnapshotRequest {
  string database = 1;
  uint64 epoch = 2;
  // Set when the snapshot seeds a fork (ADR-0046, points 4.1 and 4.4), under the `seeding`
  // binding: the fork's name, its incarnation and operation ID (its fork identity), and the
  // attempt. `database` then names the source, whose incarnation the caller expects in
  // `source_incarnation`, when the seeder fetches from the source's primary; with `staged`,
  // `database` names the fork, and a replica copies the seeder's staged copy. Unset by nodes that
  // predate forks.
  optional string fork = 3;
  fixed64 fork_incarnation = 4;
  bytes operation = 5;
  uint32 fork_attempt = 6;
  fixed64 source_incarnation = 7;
  bool staged = 8;
}

message SnapshotChunk {
  uint64 offset = 1;
  bytes data = 2;
  // Set on the last chunk, which carries no data: the position the snapshot corresponds to, and
  // the stream's checksum (XXH3-128 over every chunk's data, big-endian). An interrupted transfer
  // restarts from offset 0.
  optional bytes position = 3;
  optional bytes checksum = 4;
  // On the last chunk: the primary's hash chain at `position` (FR-044), which the follower's
  // chain continues from. Unset by a primary that predates the field.
  optional bytes chain = 5;
  // On the first chunk of a stream that seeds a fork: the snapshot's size, for disk admission
  // and progress (ADR-0046, point 4.2).
  optional uint64 total_bytes = 6;
  // On the last chunk of a stream that seeds a fork: the incarnation recorded beside the copy
  // the primary held open, which the seeder compares with what it asked for (ADR-0046, point
  // 4.1).
  optional fixed64 source_incarnation = 7;
}

// ---- Database (v0.1 only; the router replaces it) ---------------------------------------------

// Every data node serves it. A node that doesn't hold a database's lease answers UNAVAILABLE and
// names the primary as `host:port` in the `fleetring-primary` metadata entry.
service Database {
  // Scope: write on the database.
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  // Scope: read on the database.
  rpc Query(QueryRequest) returns (QueryResponse);
  // Makes the receiving node the primary of a database the control plane has created but not
  // leased yet: it takes the first lease and creates the database. Repeating it on the primary
  // is harmless.
  // Scope: admin on the database.
  rpc Create(CreateRequest) returns (CreateResponse);
  // What this node knows on its own, without asking the control plane: its membership epoch and
  // ring fingerprint, the databases it serves with their roles, and the orphan copies it keeps.
  // Scope: read or stream per database listed, or fleet.
  rpc NodeStatus(NodeStatusRequest) returns (NodeStatusResponse);
  // The leases this node holds, as the node itself sees them (FR-042): first every database it
  // serves with its epoch (`HeldLeases`), then one event per lease gained or lost, in the order the
  // node records them. A lease is gained before the node acknowledges a write under its epoch,
  // and lost before the node stops answering for the database. A subscriber that falls behind
  // gets RESOURCE_EXHAUSTED and opens the stream again, which starts with the leases held then.
  // Scope: read per database listed, or fleet.
  rpc WatchLeases(WatchLeasesRequest) returns (stream LeaseUpdate);
  // This node's hash chain over a database's replication log at a position (FR-044), read back
  // from its copy, so that an operator can compare every replica's. Any replica answers.
  // Scope: read on the database, or fleet.
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  // Builds a new database from an archive (FR-049): the database must exist in the control plane,
  // unleased, and the receiving node must be in its replica set. The node restores the archived
  // `source` into its own copy, verifying every batch against the hash chain, takes the first
  // lease, and serves it; followers seed from it. The handler also requires admin on `source`.
  // A node runs one restore or verification at a time; another gets UNAVAILABLE.
  // Scope: admin on the database.
  rpc Restore(RestoreRequest) returns (RestoreResponse);
  // What an archive holds for a database: its snapshots and how far its segments reach.
  // Scope: read on the database, or fleet.
  rpc DescribeArchive(DescribeArchiveRequest) returns (DescribeArchiveResponse);
  // Restores an archived database into a scratch directory, verifying every batch against the
  // hash chain, and discards it. It costs the node a whole copy on its disk, so it needs admin,
  // as a restore does, and a node runs one verification or restore at a time; another gets
  // UNAVAILABLE, which a retry settles.
  // Scope: admin on the database.
  rpc VerifyArchive(VerifyArchiveRequest) returns (VerifyArchiveResponse);
  // A database's tables, views, indexes, triggers, and virtual tables, with their definitions
  // and capped row counts, from its primary (ADR-0041 point 6). The primary answers and any
  // other node redirects to it, as for Query; an engine that can't describe itself answers
  // UNIMPLEMENTED.
  // Scope: read on the database.
  rpc Schema(SchemaRequest) returns (SchemaResponse);
  // Deletes this node's orphan copy of a database: one it kept, closed, because the control
  // plane didn't know the database or held it only at a lower epoch, and no drop was seen
  // (ADR-0042). Refused for a name the node serves, follows, or is dropping.
  // Scope: fleet.
  rpc RemoveOrphan(RemoveOrphanRequest) returns (RemoveOrphanResponse);
  // Follows a database's recorded row changes (ADR-0045): first `ChangesOpened`, then one
  // `ChangedTransaction` per committed transaction that changed a captured row, in commit order,
  // never past the write quorum's position. The primary answers and any other node redirects to
  // it, as for Query. It serves only a database that records its changes, because a logical
  // change sink names it (FAILED_PRECONDITION otherwise). With `after`, the stream resumes after
  // that position, which must not be past the log's end, and whose changes the primary must
  // still hold every one of: OUT_OF_RANGE otherwise, naming the oldest position it holds them
  // from. The stream ends with UNAVAILABLE once the node stops serving the database at the epoch
  // it opened under, with RESOURCE_EXHAUSTED once the subscriber falls too far behind, and with
  // OUT_OF_RANGE if the changes it is about to read were pruned; each names the position to
  // resume after. A node serves a bounded number of watchers; the next gets UNAVAILABLE.
  // Scope: stream on the database.
  rpc WatchChanges(WatchChangesRequest) returns (stream ChangeUpdate);
  // One Hrana stream's statements on the database's primary (ADR-0037): the first message opens
  // the session, then calls run one at a time, in order, with SQLite's own transaction semantics
  // on the primary's writer, so a transaction can span calls. A node that isn't the primary
  // refuses the open with UNAVAILABLE and the `fleetring-primary` hint. A caller without write on
  // the database gets a read-only session, in which every statement that may write or controls
  // a transaction fails with PERMISSION_DENIED without running. A call that committed is
  // answered once its write quorum holds it. A call refused before any of it ran is answered
  // with `not_run`. The session ends with UNAVAILABLE and the hint when the node stops serving
  // the database at the epoch it opened under, which rolls back its open transaction, and with
  // ABORTED when a commit can't reach its write quorum or its transaction outlived the node's
  // limit.
  // Scope: read on the database.
  rpc Session(stream SessionRequest) returns (stream SessionResponse);
}

// One message of a `Session` stream from its caller: `open` first, then calls.
message SessionRequest {
  oneof request {
    SessionOpen open = 1;
    SessionCall call = 2;
  }
}

message SessionOpen {
  string database = 1;
}

message SessionCall {
  // Chosen by the caller, increasing; the result carries it back.
  uint64 call_id = 1;
  oneof call {
    SessionStatement execute = 2;
    SessionBatch batch = 3;
    // Several statements in one text, run in order until the first fails.
    string sequence = 4;
    // One statement to describe without running it.
    string describe = 5;
    GetAutocommit get_autocommit = 6;
  }
}

message SessionStatement {
  string sql = 1;
  repeated Value args = 2;
  repeated NamedValue named_args = 3;
  // Unset or true: the result carries rows.
  optional bool want_rows = 4;
}

message NamedValue {
  // With its prefix character, `:a`, `@a`, or `$a`; one without is tried with each.
  string name = 1;
  Value value = 2;
}

message SessionBatch {
  repeated BatchStep steps = 1;
}

message BatchStep {
  // Unset: the step always runs.
  optional BatchCondition condition = 1;
  SessionStatement statement = 2;
}

message BatchCondition {
  oneof condition {
    uint32 ok = 1;
    uint32 error = 2;
    BatchCondition not = 3;
    BatchConditions and = 4;
    BatchConditions or = 5;
    IsAutocommit is_autocommit = 6;
  }
}

message BatchConditions {
  repeated BatchCondition conditions = 1;
}

message IsAutocommit {}

message GetAutocommit {}

// One message of a `Session` stream to its caller: `opened` first, then one result per call.
message SessionResponse {
  oneof response {
    SessionOpened opened = 1;
    SessionResult result = 2;
  }
}

message SessionOpened {
  // The primary's node ID and the lease epoch it serves at.
  string primary = 1;
  uint64 epoch = 2;
  // Set when the caller may only read.
  bool read_only = 3;
}

message SessionResult {
  uint64 call_id = 1;
  oneof result {
    StatementResult statement = 2;
    BatchResult batch = 3;
    SequenceResult sequence = 4;
    Described described = 5;
    AutocommitResult autocommit_result = 6;
    // The call's statement failed (execute, sequence, describe); the session goes on.
    SessionError error = 7;
    // The node refused the call before any of it ran.
    NotRun not_run = 10;
  }
  // Whether the session is outside a transaction after the call.
  bool autocommit = 8;
  // Set when the call committed one or more transactions, once the last one's write quorum
  // holds it.
  optional Commit commit = 9;
}

message StatementResult {
  repeated SessionColumn columns = 1;
  repeated Row rows = 2;
  uint64 affected_row_count = 3;
  optional sint64 last_insert_rowid = 4;
}

message SessionColumn {
  optional string name = 1;
  optional string decltype = 2;
}

message BatchResult {
  repeated BatchStepResult steps = 1;
}

message BatchStepResult {
  oneof step {
    StatementResult ok = 1;
    SessionError error = 2;
    Skipped skipped = 3;
  }
}

message Skipped {}

message SequenceResult {}

message AutocommitResult {}

message Described {
  repeated DescribedParam params = 1;
  repeated SessionColumn columns = 2;
  bool is_explain = 3;
  bool is_readonly = 4;
}

message DescribedParam {
  optional string name = 1;
}

message SessionError {
  string message = 1;
  // SQLite's extended result code name, or PERMISSION_DENIED, FLEETRING_SAVEPOINT,
  // FLEETRING_VALUE, FLEETRING_RESULT_TOO_LARGE, DEADLINE_EXCEEDED, CANCELLED, or
  // FLEETRING_UNACKNOWLEDGED.
  string code = 2;
}

// A call the node refused before any of it ran, so that the caller may send it again.
message NotRun {
  // UNAVAILABLE: the node no longer serves the database, and `primary` names the node that
  // does when it is known, or the replica floor isn't met; RESOURCE_EXHAUSTED: another
  // session's transaction holds the writer and too many writes wait for it.
  string code = 1;
  string message = 2;
  // The new primary's address, when the database moved.
  optional string primary = 3;
  // Set when the session ends after this answer: the database moved, or the session's
  // transaction is gone (FLEETRING_TRANSACTION_ABORTED), so that the caller opens a new one.
  bool ends_session = 4;
}

message Commit {
  // How many replicas hold the transaction, the primary included, and R.
  uint32 acknowledged_by = 1;
  uint32 replicas = 2;
  bool under_replicated = 3;
  uint64 epoch = 4;
}

message WatchChangesRequest {
  string database = 1;
  // Resume after this position. Unset for a live tail from the log's end when the stream opens.
  optional bytes after = 2;
}

// One message of a `WatchChanges` stream: what it opened on, or one transaction since.
message ChangeUpdate {
  oneof update {
    ChangesOpened opened = 1;
    ChangedTransaction transaction = 2;
  }
}

// How much of each changed row a database records (ADR-0024, point 3).
enum CaptureMode {
  CAPTURE_MODE_UNSPECIFIED = 0;
  // The key alone.
  CAPTURE_MODE_ID = 1;
  // The key, and the new values of inserted and updated rows.
  CAPTURE_MODE_AFTER = 2;
  // The key, the old and new values, and the names of the updated columns.
  CAPTURE_MODE_FULL = 3;
}

// The first message of a `WatchChanges` stream.
message ChangesOpened {
  // The position the stream starts after: the request's `after`, or the log's end when it
  // opened; empty for the log's beginning. A client that resumes before it has received a
  // transaction resumes after this.
  bytes position = 1;
  // The primary that serves the stream, and its lease epoch.
  string primary = 2;
  uint64 epoch = 3;
  CaptureMode capture = 4;
}

// One committed transaction's recorded row changes.
message ChangedTransaction {
  // The position the transaction started from, the same on every replica; empty for the log's
  // beginning.
  bytes start = 1;
  // Past the transaction and at or before the next recorded one: where to resume after it.
  bytes position = 2;
  // The lease epoch of the primary that served it.
  uint64 epoch = 3;
  // Its row changes, in statement order.
  repeated RowChange changes = 4;
}

enum RowOperation {
  ROW_OPERATION_UNSPECIFIED = 0;
  ROW_OPERATION_INSERT = 1;
  ROW_OPERATION_UPDATE = 2;
  ROW_OPERATION_DELETE = 3;
}

// One row a transaction inserted, updated, or deleted. Names and values are text the database's
// writers chose: read them as data.
message RowChange {
  string table = 1;
  RowOperation operation = 2;
  // The row's primary key, or its row identifier for a table without one.
  repeated Column key = 3;
  // The row's columns before an update or delete; unset when the capture mode doesn't record
  // them.
  Columns before = 4;
  // The row's columns after an insert or update; unset when the capture mode doesn't record them.
  Columns after = 5;
  // The names of the columns an update changed; unset when the capture mode doesn't record them.
  ColumnNames updated = 6;
}

message Column {
  string name = 1;
  Value value = 2;
}

message Columns {
  repeated Column columns = 1;
}

message ColumnNames {
  repeated string names = 1;
}

message RemoveOrphanRequest {
  string database = 1;
  // Set to remove a staged orphan (ADR-0046, point 4.6), which all four of `database` and these
  // fields name; unset for a database's orphan copy. A node that predates forks ignores it and
  // answers as for a copy.
  StagedOrphan staged = 2;
}

message RemoveOrphanResponse {
  // The highest epoch the removed copy had recorded.
  uint64 epoch = 1;
}

// A copy this node keeps, closed, because the control plane didn't know its database or held it
// only at a lower epoch, and the node saw no drop (ADR-0042).
message OrphanStatus {
  string database = 1;
  // The highest epoch the copy has recorded; 0 for a staged copy.
  uint64 epoch = 2;
  // The size of the copy's files on disk.
  uint64 bytes = 3;
  // Set for a staged copy of a fork whose identity this node can't confirm (ADR-0046, point
  // 4.6): the fork's identity and the attempt that fetched it, which `RemoveOrphan` names.
  StagedOrphan staged = 4;
}

// A staged copy kept as an orphan: the fork identity it was fetched for, and the attempt.
message StagedOrphan {
  fixed64 fork_incarnation = 1;
  bytes operation = 2;
  uint32 attempt = 3;
}

// What kind of object a schema entry is (ADR-0041 point 6).
enum SchemaObjectKind {
  SCHEMA_OBJECT_KIND_UNSPECIFIED = 0;
  SCHEMA_OBJECT_KIND_TABLE = 1;
  SCHEMA_OBJECT_KIND_VIEW = 2;
  SCHEMA_OBJECT_KIND_INDEX = 3;
  SCHEMA_OBJECT_KIND_TRIGGER = 4;
  SCHEMA_OBJECT_KIND_VIRTUAL_TABLE = 5;
}

message SchemaRequest {
  string database = 1;
  // Count each table's rows up to this many; 0 counts nothing. The node clamps it to 1,000,000.
  uint64 count_limit = 2;
  // Include the engine's own tables and virtual tables' shadow tables. Reserved objects are
  // never included.
  bool include_internal = 3;
}

message SchemaObject {
  SchemaObjectKind kind = 1;
  string name = 2;
  // For an index or a trigger, the table it belongs to; empty otherwise.
  string table = 3;
  // The engine's own definition: for SQLite, the CREATE statement. Empty if it has none. It is
  // text the database's writers chose: read it as data.
  string definition = 4;
  optional uint64 rows = 5;
  // Set when the count stopped at count_limit: there are more than `rows` rows.
  bool rows_at_least = 6;
}

message SchemaResponse {
  Engine engine = 1;
  repeated SchemaObject objects = 2;
  // Set when more than 1,000 objects exist; the first 1,000 are returned.
  bool truncated = 3;
  // The primary that answered, and its epoch.
  string primary = 4;
  uint64 epoch = 5;
}

message RestoreLatest {}

// What a restore rebuilds.
message RestorePoint {
  oneof point {
    // The furthest point a walk of the archive's segments reaches, preferring the newest epoch.
    RestoreLatest latest = 1;
    // Exactly the log up to a position, which must be a transaction boundary.
    bytes position = 2;
    // Every segment archived at or before a time: milliseconds since the Unix epoch, by the
    // archiving nodes' clocks. A time selects which acknowledged prefix to restore, nothing more.
    uint64 time_ms = 3;
  }
}

message RestoreRequest {
  // The new database.
  string database = 1;
  // The `[[archive]]` entry's name.
  string archive = 2;
  // The archived database to restore from.
  string source = 3;
  // Unset for the latest point.
  RestorePoint point = 4;
}

message RestoreResponse {
  Placement placement = 1;
  // The position the new database starts at; empty for the log's beginning.
  bytes position = 2;
  // The 32-byte hash chain at `position`, verified over every batch applied.
  bytes chain_hash = 3;
  // The snapshot the restore started from.
  string snapshot = 4;
  // How many segments it applied.
  uint32 segments = 5;
  // When the last segment applied was archived; unset if the restore applied no segment.
  optional uint64 archived_at_ms = 6;
  // The metadata the archive holds for the source, as of the snapshot the restore started from
  // (ADR-0041, point 10). Unset when the snapshot has none, when the archive predates metadata,
  // or when its object was skipped (`archived_metadata_skipped`). The archive isn't signed, so
  // `description_by` and `created_by` are its claims and nothing more; `expires_at_ms` is never
  // to be restored.
  DatabaseMetadata archived_metadata = 7;
  // Why the snapshot's metadata object was skipped: missing, damaged, or too large. The data
  // restored either way. Unset when nothing was skipped.
  optional string archived_metadata_skipped = 8;
}

message DescribeArchiveRequest {
  string database = 1;
  string archive = 2;
}

message ArchivedSnapshot {
  string id = 1;
  uint64 epoch = 2;
  bytes position = 3;
  uint64 taken_at_ms = 4;
  uint64 bytes = 5;
  // The snapshot has a metadata object under `.metadata/`.
  bool metadata = 6;
}

message DescribeArchiveResponse {
  string database = 1;
  // The complete snapshots, oldest first.
  repeated ArchivedSnapshot snapshots = 2;
  // The furthest position a snapshot or segment reaches, and when its last segment was archived.
  bytes latest = 3;
  optional uint64 latest_ms = 4;
  uint32 segments = 5;
  uint64 segment_bytes = 6;
  // Objects a restore won't use: incomplete snapshots, and objects that don't read back as what
  // their names say.
  uint32 incomplete = 7;
  repeated string damaged = 8;
}

message VerifyArchiveRequest {
  string database = 1;
  string archive = 2;
  // Unset for the latest point.
  RestorePoint point = 3;
}

message VerifyArchiveResponse {
  bytes position = 1;
  bytes chain_hash = 2;
  string snapshot = 3;
  uint32 segments = 4;
}

message WatchLeasesRequest {}

// One message of a `WatchLeases` stream: the leases held when it opens, or a change since.
message LeaseUpdate {
  oneof update {
    HeldLeases held = 1;
    LeaseEvent event = 2;
  }
}

// Every lease the node holds when the stream opens, in database name order.
message HeldLeases {
  string node_id = 1;
  repeated HeldLease leases = 2;
}

message HeldLease {
  string database = 1;
  uint64 epoch = 2;
}

enum LeaseEventKind {
  LEASE_EVENT_KIND_UNSPECIFIED = 0;
  // The node started serving the database at `epoch`.
  LEASE_EVENT_KIND_GAINED = 1;
  // The node stopped serving the database; `epoch` is the epoch that ended.
  LEASE_EVENT_KIND_LOST = 2;
}

message LeaseEvent {
  string database = 1;
  uint64 epoch = 2;
  LeaseEventKind kind = 3;
}

message VerifyRequest {
  string database = 1;
  // The position to report the chain at; empty for the latest this replica holds.
  bytes position = 2;
}

message VerifyResponse {
  string database = 1;
  // The epoch of the primary that wrote the last frames of this replica's log.
  uint64 epoch = 2;
  // The position the chain hash is at; empty for an empty log.
  bytes position = 3;
  // The 32-byte BLAKE3 chain hash at `position`.
  bytes chain_hash = 4;
}

message NodeStatusRequest {}

message NodeStatusResponse {
  string node_id = 1;
  uint64 membership_epoch = 2;
  // Unset while the node has no ring.
  optional uint64 ring_fingerprint = 3;
  // The databases this node is primary for or follows, in name order.
  repeated DatabaseStatus databases = 4;
  // Each change sink's progress on each database this node feeds it, in sink and database
  // order (FR-039).
  repeated ChangeSinkStatus sinks = 5;
  // The orphan copies this node keeps, in name order (ADR-0042). Empty from a node that
  // predates the field, which never keeps one.
  repeated OrphanStatus orphans = 6;
}

// One change sink's progress on one database.
message ChangeSinkStatus {
  string sink = 1;
  string database = 2;
  // The last position the sink took; empty if none yet.
  bytes position = 3;
  // The write quorum's position; empty if it holds no batch yet.
  bytes acknowledged = 4;
  // Batches published since the sink's position, as far as the primary knows.
  uint64 backlog = 5;
  // Deliveries that failed and were retried.
  uint64 failures = 6;
  // Times the log moved past the sink's position, so the stream skipped ahead.
  uint64 resets = 7;
  // The last delivery failure's reason; empty if none.
  string last_error = 8;
  // Set when the sink's position is kept in the database and replicates with it (FR-041); unset
  // when it is kept on this node only, or by a node that predates the field.
  bool replicated = 9;
}

message Value {
  oneof value {
    bool null = 1;
    sint64 integer = 2;
    double real = 3;
    string text = 4;
    bytes blob = 5;
  }
}

message ExecuteRequest {
  string database = 1;
  string sql = 2;
  repeated Value params = 3;
}

message ExecuteResponse {
  uint64 rows_affected = 1;
  uint32 acknowledged_by = 2;
  bool under_replicated = 3;
  // The size of the database's replica set.
  uint32 replicas = 4;
  // The primary that acknowledged the write, and the epoch it serves at.
  string primary = 5;
  uint64 epoch = 6;
}

message QueryRequest {
  string database = 1;
  string sql = 2;
  repeated Value params = 3;
  // Stop after this many rows, and set QueryResponse.truncated if there are more; 0 for no
  // limit (ADR-0041, point 9). A node that predates the field returns every row, so a client
  // that sets it truncates the reply too.
  uint32 max_rows = 4;
}

message Row {
  repeated Value values = 1;
}

message QueryResponse {
  repeated string columns = 1;
  repeated Row rows = 2;
  // Set when the query had more rows than QueryRequest.max_rows.
  bool truncated = 3;
}

message CreateRequest {
  string database = 1;
}

message CreateResponse {
  Placement placement = 1;
}
