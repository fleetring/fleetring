[package]
name = "fleetringd"
description = "The FleetRing daemon: places, replicates, and fails over SQLite databases across machines you own."
version = "0.0.0"
publish = false
edition.workspace = true
# `File::try_lock` (data directory lock) needs 1.89. `fleetring` keeps its own MSRV (ADR-0015).
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
arc-swap.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
fleetring = { path = "../fleetring", features = ["serde"] }
fleetring-control = { version = "0.0.0", path = "../fleetring-control" }
fleetring-proto = { version = "0.0.0", path = "../fleetring-proto" }
fleetring-wal = { version = "0.0.0", path = "../fleetring-wal" }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile = { version = "3.27.0", optional = true }
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "1.1.8"
tonic = "0.14"
tower = { version = "0.5", features = ["util"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
turmoil = { version = "0.7", optional = true }

[features]
# The simulation harness (`fleetringd::sim`): the daemon over turmoil's simulated network and
# clock (ADR-0020).
simulation = ["dep:turmoil", "dep:hyper-util", "dep:tower", "dep:tempfile"]

[lints]
workspace = true

[[test]]
name = "sim"
required-features = ["simulation"]

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "test-util"] }
tokio-stream = "0.1"

