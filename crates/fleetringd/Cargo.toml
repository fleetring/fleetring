[package]
name = "fleetringd"
description = "The FleetRing daemon: places, replicates, and fails over SQLite databases across machines you own."
version = "0.7.0"
publish = false
edition.workspace = true
# `File::try_lock` (data directory lock) needs 1.89. `fleetring` keeps its own MSRV (ADR-0015).
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
arc-swap.workspace = true
base64 = "0.22"
blake3.workspace = true
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
# `fleetring completions`: the shell runs the binary again on each Tab, so context names and
# agent IDs complete from this machine's files (docs/cli.md, section 9).
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
# The picker `fleetring switch` opens on a terminal (ADR-0043, point 12).
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select"] }
fleetring = { path = "../fleetring", features = ["serde"] }
fleetring-client = { version = "0.0.0", path = "../fleetring-client" }
fleetring-control = { version = "0.0.0", path = "../fleetring-control" }
fleetring-proto = { version = "0.0.0", path = "../fleetring-proto" }
fleetring-wal = { version = "0.0.0", path = "../fleetring-wal" }
# `fleetringd upgrade` reads the one binary out of a release's `.tar.gz` (ADR-0038).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server", "server-auto", "tokio"] }
# Spinners on stderr for slow commands (ADR-0043, point 6).
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
prometheus-client = "0.25"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
# Kept behind `fleetringd::mcp` alone (ADR-0041 point 9).
rmcp.workspace = true
rusqlite = { workspace = true, features = ["column_decltype", "functions", "hooks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
rusty-s3 = { version = "0.11", default-features = false, features = ["rustcrypto", "full"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tar = { version = "0.4.44", default-features = false }
tempfile = "3.27.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "sync", "time"] }
toml = "1.1.8"
tonic = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-stream = { version = "0.1", features = ["sync"] }
turmoil = { version = "0.7", optional = true }
twox-hash = { workspace = true, features = ["alloc", "xxhash3_128"] }
x509-parser = "0.18"
zeroize = "1"

# `fleetringd upgrade` restarts a running daemon in place with SIGHUP (ADR-0038). rustix is
# already in the tree, through tempfile.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "process", "fs"] }

[features]
# The simulation harness (`fleetringd::sim`): the daemon over turmoil's simulated network and
# clock (ADR-0020).
simulation = ["dep:turmoil"]
# Fault hooks for the fork tests (FR-085): points where a test holds a node's fork work, and a
# stand-in for its free disk. A build without debug assertions, such as `--release`, refuses it.
fault-hooks = []

[lints]
workspace = true

# One binary, `fleetring`; `fleetringd` is the same file under a second name until 1.0, and the
# package keeps its name (ADR-0043, point 1).
[[bin]]
name = "fleetring"
path = "src/main.rs"

[[test]]
name = "sim"
required-features = ["simulation"]

[[test]]
name = "fork_cli"
required-features = ["fault-hooks"]

[[test]]
name = "fork"
required-features = ["fault-hooks"]

[[bench]]
name = "capture"
harness = false

[[bench]]
name = "observe"
harness = false

[[bench]]
name = "fork"
harness = false

[dev-dependencies]
# Renders the man pages checked in under `man/`, in a test (docs/cli.md, section 9).
clap_mangen = "0.3.3"
divan.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }

