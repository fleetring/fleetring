[package]
name = "fleetringd"
description = "The FleetRing daemon: places, replicates, and fails over SQLite databases across machines you own."
version = "0.0.0"
publish = false
edition.workspace = true
# `File::try_lock` (data directory lock) needs 1.89. `fleetring` keeps its own MSRV (ADR-0015).
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fleetring = { path = "../fleetring", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
