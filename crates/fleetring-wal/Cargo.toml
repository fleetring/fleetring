[package]
name = "fleetring-wal"
description = "Read, validate, and mirror SQLite WAL files for FleetRing's SQLite engine adapter."
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

# Real SQLite checks the format end to end. It needs a C toolchain and files, so it stays off wasm.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"

[lints]
workspace = true
