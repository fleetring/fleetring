[package]
name = "fleetring"
description = "Deterministic, cross-language placement with zone-aware replicas: weighted rendezvous or vnode consistent hashing, bounded loads, and migration planning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/fleetring"
readme = "README.md"
keywords = ["consistent-hashing", "rendezvous-hashing", "placement", "sharding", "distributed"]
categories = ["algorithms", "data-structures", "network-programming"]

[features]
default = ["std"]
# Reserved so `no_std + alloc` support can land without breaking `default-features = false` users.
std = []
# serde support for `RingSpec` and the types it holds, so rings can be stored and shipped (ADR-0008).
serde = ["dep:serde"]
# Test doubles for downstream tests. Never enable in production builds.
test-util = []

[dependencies]
serde = { workspace = true, optional = true }
smallvec.workspace = true
thiserror.workspace = true
twox-hash.workspace = true

[dev-dependencies]
divan.workspace = true
proptest.workspace = true
serde_json.workspace = true

# dhat counts heap allocations for the allocation-free lookup check; it doesn't target wasm.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
dhat.workspace = true

[[test]]
name = "alloc_free"
harness = false

[[bench]]
name = "lookup"
harness = false

# Serializes a ring spec to JSON, so it needs serde support.
[[example]]
name = "spec_roundtrip"
required-features = ["serde"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
