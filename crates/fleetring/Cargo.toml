[package]
name = "fleetring"
description = "Consistent-hashing placement and routing for fleets of SQLite, libSQL, and Turso databases: one database per agent, tenant, or device."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/fleetring"
readme = "README.md"
keywords = ["sqlite", "libsql", "turso", "consistent-hashing", "distributed"]
categories = ["database", "algorithms", "network-programming"]

[features]
default = ["std"]
# Reserved so `no_std + alloc` support can land without breaking `default-features = false` users.
std = []
# Test doubles for downstream tests. Never enable in production builds.
test-util = []

[dependencies]
thiserror.workspace = true
twox-hash.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
