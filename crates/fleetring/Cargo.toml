[package]
name = "fleetring"
description = "Consistent-hashing placement and routing for fleets of SQLite, libSQL, and Turso databases: one database per agent, tenant, or device."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/fleetring"
readme = "README.md"
keywords = ["sqlite", "libsql", "turso", "consistent-hashing", "distributed"]
categories = ["database", "algorithms", "network-programming"]

[features]
default = ["std"]
# Reserved so `no_std + alloc` support can land without breaking `default-features = false` users.
std = []
# Test doubles for downstream tests. Never enable in production builds.
test-util = []

[dependencies]
smallvec.workspace = true
thiserror.workspace = true
twox-hash.workspace = true

[dev-dependencies]
proptest.workspace = true

# dhat counts heap allocations for the allocation-free lookup check; it doesn't target wasm.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
dhat.workspace = true

[[test]]
name = "alloc_free"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
