[package]
name = "fleetring-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
base64 = "0.22"
fleetring = { path = "../crates/fleetring", features = ["serde"] }
fleetring-control = { path = "../crates/fleetring-control" }
# For the `token` target: the node's token verifier and issuer certificate checks (FR-090).
fleetringd = { path = "../crates/fleetringd", default-features = false }
libfuzzer-sys = "0.4"
# For the `token` target: the fixture's issuer key signs the fuzzed claims.
ring = "0.17"
rustls-pki-types = { version = "1", features = ["std"] }
serde_json = "1"

[[bin]]
name = "spec_json"
path = "fuzz_targets/spec_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "builder"
path = "fuzz_targets/builder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lookup"
path = "fuzz_targets/lookup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "token"
path = "fuzz_targets/token.rs"
test = false
doc = false
bench = false

# A workspace of its own: fuzzing needs nightly, and the main workspace's lints and members
# don't apply here.
[workspace]
members = ["."]
