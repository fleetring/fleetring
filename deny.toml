# Dependency policy (ADR-0009). Run locally with `cargo deny check`.
# Not checked: `tests/router-conformance`, a workspace of its own that tests the router with the
# libSQL client and never ships; its dependencies stay out of the release's graph and lock.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
