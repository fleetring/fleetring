# An example fleetringd configuration, and the one the container image starts with (FR-034).
#
# It runs a one-node fleet: the control role and the data role in one process. To change it,
# mount your own file over /etc/fleetring/fleetringd.toml, or override single fields with flags:
# `--node-id`, `--data-dir`, `--listen`, `--advertise`, `--control`, `--role`, and
# `--insecure-plaintext`.

# Where the node keeps its databases. The daemon locks it, so one directory serves one daemon.
# The container image declares /data as a volume.
data_dir = "/data"

# The address the node serves gRPC on, for clients and for other nodes. 0.0.0.0 accepts
# connections on every interface, so the port can be published from a container.
listen = "0.0.0.0:7400"

# `both` runs the control plane and hosts databases in one process. In a larger fleet, one node
# runs `both` (or `control`), and every other node runs `data` and sets `control.address`.
role = "both"

# Without a [tls] table the daemon refuses to start, unless this is set (or `--insecure-plaintext`
# is passed): it then serves and dials in plaintext, warning at every start. Nothing on the wire is
# authenticated or encrypted, so this is for local experiments only.
# insecure_plaintext = true

[tls]
# Every connection is mutual TLS (ADR-0025). The node presents the certificate `cert` with its key,
# and trusts the authority certificates in `ca`; clients and other nodes must present certificates
# from the same authority. Create them with the built-in authority, on a machine that keeps ca.key:
#
#   fleetringd cert init --fleet home --dir ./tls
#   fleetringd cert node node-1 --hosts 192.0.2.10,node-1.example --dir ./tls
#   fleetringd cert client admin --dir ./tls
#
# then copy ca.crt, node.node-1.crt, and node.node-1.key to the node (for the container image,
# mount them under /etc/fleetring/tls). Keep ca.key off every node. The files are re-read when they
# change, so renewing a certificate needs no restart; `ca` may hold two authority certificates while
# a rotation overlaps. Certificates from another authority (Vault, cert-manager, SPIRE) work the
# same way.
ca = "/etc/fleetring/tls/ca.crt"
cert = "/etc/fleetring/tls/node.crt"
key = "/etc/fleetring/tls/node.key"

[node]
# The node's stable ID: 1 to 64 lowercase letters, digits, `-`, `_`, `.`, or `:`. Placement
# depends on it, so never change it once the node holds data.
id = "node-1"

# The failure domain replicas spread across first, and the machine, when several nodes share one.
# zone = "home"
# host = "nas-1"

# The node's share of databases, relative to the other nodes.
# weight = 1

# The IP address and port other nodes and clients reach this node at. It defaults to `listen`,
# with the loopback address in place of 0.0.0.0, which only works when everything runs on one
# machine (or in one container). Set it to the host's address and published port otherwise.
# advertise = "192.0.2.10:7400"

# [control]
# The control node's address. Required when `role = "data"`.
# address = "192.0.2.1:7400"

# [replication]
# The durability a database gets when `db create` names none (ADR-0023). Each database keeps the
# settings it was created with; `db set-durability` changes them from its next epoch on.
#
# `acks` says how many replicas must hold a write before it is acknowledged:
#   "quorum"  a majority (the default): no acknowledged write is lost while a majority survives
#   "all"     every replica: one replica down blocks writes
#   "local"   the primary alone, after its own fsync: fastest, but a failover may lose
#             acknowledged writes
# acks = "quorum"
#
# `min_replicas` is the floor on reachable replicas, the primary included: a write that arrives
# while fewer are reachable is refused with UNAVAILABLE before anything commits, so a client can
# retry it cleanly. It lies between the write quorum and the replication factor, and defaults to
# the write quorum; a default outside that range for a database is clamped into it.
# min_replicas = 2

# [membership]
# What a graceful stop (SIGINT, SIGTERM, `fleetringd stop`) does with the node's membership.
#   "leave"   the default: the node drains first, handing each database it is primary for to
#             the most advanced follower so clients see a short redirect instead of a failover,
#             then leaves the fleet and the ring is rebuilt without it
#   "stay"    the node stays a member, marked down once its heartbeats stop, and keeps its
#             leases and its places in replica sets for a quick restart; nothing drains
# on_shutdown = "leave"

# [[changes.sink]]
# Change streams (FR-039): each entry sends every acknowledged batch of the databases it names
# to a sink, beside replication and never in a write's acknowledgement path. Delivery is at least
# once, in commit order, resuming after a restart from the position kept under
# `<data_dir>/changes/<name>/`; `status --node` shows each sink's position and backlog.
#
# `name`       1 to 64 lowercase letters, digits, `-`, or `_`; unique
# `kind`       "file"     appends one JSON line per batch to `<path>/<database>.ndjson`
#              "webhook"  POSTs each batch as JSON to `url`, retrying 5xx with backoff
# `format`     "logical"  (the default) the rows each transaction inserted, updated, or deleted;
#                         schema changes aren't included
#              "physical" the opaque batch, for a mirror or an archive the same engine applies
# `capture`    for a logical sink, how much of each changed row it receives:
#              "id"       the row's key alone
#              "after"    (the default) the key, and the new values of an inserted or updated row
#              "full"     also the old values of an updated or deleted row, and the names of the
#                         columns an update changed
#              A database named by several logical sinks records in the strongest mode asked for.
#              Row changes are recorded in the database itself, in the reserved table
#              `_fleetring_cdc`, which replicates with the data; statements that name anything
#              beginning with `_fleetring_` are refused.
# `databases`  exact names or prefixes ending in `*`; `["*"]` streams every database
#
# name = "archive"
# kind = "file"
# format = "logical"
# capture = "after"
# databases = ["tenant:*", "ledger"]
# path = "/data/changes"
#
# [[changes.sink]]
# name = "hooks"
# kind = "webhook"
# databases = ["*"]
# url = "http://127.0.0.1:8080/changes"
# timeout_ms = 5000      # how long one request may take
# retries = 5            # retries before the change is handed back and retried later

# Principals: what each client certificate may do (ADR-0025). Every connection carries a
# certificate, and a principal (`cert client <name>`) may do only what its scopes allow; one this
# file doesn't list may do nothing with its certificate alone. Keep the list identical on every
# node. A scope is `<action>:<pattern>`, the action `read`, `write`, `admin`, or `stream` over an
# exact database name or a prefix ending in `*`; `write` implies `read`, `admin` implies both,
# and `stream` stands alone. `fleet` allows the operations that name no database: membership,
# draining, revoking tokens. The table of what each RPC needs is in the daemon README, under
# "Principals and scopes".
#
# An application usually connects with its own certificate and a short-lived token instead:
#
#   fleetringd token issue --principal notes-app --scope write:notes --ttl 1h --dir ./tls
#
# The token carries its scopes, so `notes-app` needs no entry here. A request with a token acts
# with the token's scopes alone; `fleetringd token revoke --token-id <id>` refuses it on every node
# within one heartbeat interval.
[[principal]]
name = "admin"
scopes = ["admin:*", "stream:*", "fleet"]

# A router that relays its callers' tokens: its own certificate grants nothing, and a request
# carrying a caller's token acts as that caller.
# [[principal]]
# name = "router"
# scopes = []
# forward_tokens = true
