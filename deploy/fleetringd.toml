# An example node configuration, and the one the container image starts with (FR-034). Run it
# with `fleetring serve --config <this file>`. The file keeps its 0.6 name (ADR-0043, point 1.7).
#
# It runs a one-node fleet: the control role and the data role in one process. To change it,
# mount your own file over /etc/fleetring/fleetringd.toml, or override single fields with flags:
# `--node-id`, `--data-dir`, `--listen`, `--advertise`, `--control`, `--role`, and
# `--insecure-plaintext`.

# Where the node keeps its databases. The daemon locks it, so one directory serves one daemon.
# The container image declares /data as a volume.
data_dir = "/data"

# The address the node serves gRPC on, for clients and for other nodes. 0.0.0.0 accepts
# connections on every interface, so the port can be published from a container.
listen = "0.0.0.0:7400"

# `both` runs the control plane and hosts databases in one process. In a larger fleet, one node
# runs `both` (or `control`), and every other node runs `data` and sets `control.address`.
role = "both"

# Without a [tls] table the daemon refuses to start, unless this is set (or `--insecure-plaintext`
# is passed): it then serves and dials in plaintext, warning at every start. Nothing on the wire is
# authenticated or encrypted, so this is for local experiments only.
# insecure_plaintext = true

# Dev mode (ADR-0039), which `fleetring dev` writes into its own configuration: the daemon then
# refuses any listen, advertise, control, or admin address that isn't loopback, any role but
# `both`, and plaintext. Never set it on a node of a real fleet.
# dev = true

[tls]
# Every connection is mutual TLS (ADR-0025). The node presents the certificate `cert` with its key,
# and trusts the authority certificates in `ca`; clients and other nodes must present certificates
# from the same authority. Create them with the built-in authority, on a machine that keeps ca.key:
#
#   fleetring cert init --fleet home --dir ./tls
#   fleetring cert node node-1 --addresses 192.0.2.10,node-1.example --dir ./tls
#   fleetring cert client admin --dir ./tls
#
# then copy ca.crt, node.node-1.crt, and node.node-1.key to the node (for the container image,
# mount them under /etc/fleetring/tls). Keep ca.key off every node. The files are re-read when they
# change, so renewing a certificate needs no restart; `ca` may hold two authority certificates while
# a rotation overlaps. Certificates from another authority (Vault, cert-manager, SPIRE) work the
# same way.
ca = "/etc/fleetring/tls/ca.crt"
cert = "/etc/fleetring/tls/node.crt"
key = "/etc/fleetring/tls/node.key"

[node]
# The node's stable ID: 1 to 64 lowercase letters, digits, `-`, `_`, `.`, or `:`. Placement
# depends on it, so never change it once the node holds data.
id = "node-1"

# The failure domain replicas spread across first, and the machine, when several nodes share one.
# zone = "home"
# host = "nas-1"

# The node's share of databases, relative to the other nodes.
# weight = 1

# The IP address and port other nodes and clients reach this node at. It defaults to `listen`,
# with the loopback address in place of 0.0.0.0, which only works when everything runs on one
# machine (or in one container). Set it to the host's address and published port otherwise.
# advertise = "192.0.2.10:7400"

# [control]
# The control node's address. Required when `role = "data"`.
# address = "192.0.2.1:7400"

# [replication]
# The replication factor and durability a database gets when `db create` names none (ADR-0023,
# ADR-0039). Each database keeps the settings it was created with; `db edit --acks` changes
# its durability from its next epoch on. The control node reads these; a data node ignores them.
#
# `replication_factor` is how many replicas a database has, the primary included: 3 by default,
# at least 1. `fleetring dev` sets it to 1. A database created with a larger factor than the
# fleet has data nodes is accepted, with a warning, and gains replicas as nodes join.
# replication_factor = 3
#
# `acks` says how many replicas must hold a write before it is acknowledged:
#   "quorum"  a majority (the default): no acknowledged write is lost while a majority survives
#   "all"     every replica: one replica down blocks writes
#   "local"   the primary alone, after its own fsync: fastest, but a failover may lose
#             acknowledged writes
# acks = "quorum"
#
# `min_replicas` is the floor on reachable replicas, the primary included: a write that arrives
# while fewer are reachable is refused with UNAVAILABLE before anything commits, so a client can
# retry it cleanly. It lies between the write quorum and the replication factor, and defaults to
# the write quorum; a default outside that range for a database is clamped into it.
# min_replicas = 2

# [membership]
# What a graceful stop (SIGINT, SIGTERM, `fleetring stop`) does with the node's membership.
#   "leave"   the default: the node drains first, handing each database it is primary for to
#             the most advanced follower so clients see a short redirect instead of a failover,
#             then leaves the fleet and the ring is rebuilt without it
#   "stay"    the node stays a member, marked down once its heartbeats stop, and keeps its
#             leases and its places in replica sets for a quick restart; nothing drains
# on_shutdown = "leave"

# [[changes.sink]]
# Change streams (FR-039): each entry sends every acknowledged batch of the databases it names
# to a sink, beside replication and never in a write's acknowledgement path. Delivery is at least
# once, in commit order. A sink's position is kept inside the database (FR-041), so it replicates
# with the data and survives failover: a new primary resumes where the old one stopped, and
# repeats at most the last couple of batches. An engine that can't keep it there keeps it under
# `<data_dir>/changes/<name>/` on that node alone. `status --node` shows each sink's position,
# whether it is replicated or local, and its backlog.
#
# Configure the same sinks on every node that may become a database's primary, as `[[principal]]`
# must be: a sink configured only on the old primary isn't fed by the new one.
#
# `name`       1 to 64 lowercase letters, digits, `-`, or `_`; unique
# `kind`       "file"     appends one JSON line per batch to `<path>/<database>.ndjson`
#              "webhook"  POSTs each batch as JSON to `url`, over TLS, retrying 5xx and
#                         connection and TLS failures with backoff; see the example below
# `format`     "logical"  (the default) the rows each transaction inserted, updated, or deleted;
#                         schema changes aren't included
#              "physical" the opaque batch, for a mirror or an archive the same engine applies
# `capture`    for a logical sink, how much of each changed row it receives:
#              "id"       the row's key alone
#              "after"    (the default) the key, and the new values of an inserted or updated row
#              "full"     also the old values of an updated or deleted row, and the names of the
#                         columns an update changed
#              A database named by several logical sinks records in the strongest mode asked for.
#              Row changes are recorded in the database itself, in the reserved table
#              `_fleetring_cdc`, which replicates with the data, and the sinks' positions in
#              `_fleetring_sinks`; statements that name anything beginning with `_fleetring_`
#              are refused.
# `databases`  exact names or prefixes ending in `*`; `["*"]` streams every database
#
# name = "archive"
# kind = "file"
# format = "logical"
# capture = "after"
# databases = ["tenant:*", "ledger"]
# path = "/data/changes"
#
# [[changes.sink]]
# name = "hooks"
# kind = "webhook"
# databases = ["*"]
# url = "https://hooks.example.com/changes"
# timeout_ms = 5000      # how long one request may take
# retries = 5            # retries before the change is handed back and retried later
#
# A webhook is HTTPS. It trusts the platform's root certificates, as `[[archive]]` does, and
# `ca` adds the authorities in a PEM bundle to them for a receiver with a private certificate.
# A certificate it doesn't trust is a failed delivery: the change is retried with backoff and
# never dropped or skipped.
# ca = "/etc/fleetring/hooks-ca.crt"
#
# Mutual TLS, for a receiver that asks for a client certificate: a PEM chain and its key,
# both or neither.
# cert = "/etc/fleetring/hooks-client.crt"
# key = "/etc/fleetring/hooks-client.key"
#
# A bearer token, sent as `Authorization: Bearer <token>` on every request. It is never in this
# file: name a file only its owner may read (the daemon refuses one others can read), or an
# environment variable. At most one. It is read once, when the sink starts, so a new token takes
# a restart. It is zeroed in memory when dropped and never logged.
# token_file = "/etc/fleetring/hooks.token"
# token_env = "HOOKS_TOKEN"
#
# `http://` urls are refused, since every change would leave the node in plaintext, unless the
# sink says so. Use it for a receiver on the same machine, and never with a token. An https://
# url always uses TLS, whatever this says.
# allow_http = true

# [[archive]]
# Archives (FR-049, ADR-0029): each entry writes the databases it names to an object store
# outside the fleet, for point-in-time restore. Each primary uploads one immutable segment per
# delivery of acknowledged batches, carrying the hash chain at both ends, and base snapshots;
# a restore verifies every batch against the chain. The archive's recovery point is its lag,
# which `status --node` shows as its backlog; no write waits for it. Archives run on frame-source
# engines (SQLite). Configure the same entries on every node that may become a primary: a new
# primary continues the archive from the mark the old one replicated.
#
# `name`                  1 to 64 lowercase letters, digits, `-`, or `_`; unique among sinks
#                         and archives, since positions are kept by name
# `databases`             exact names or prefixes ending in `*`
# `store`                 "s3"         an S3-compatible bucket: AWS S3, MinIO, Cloudflare R2, Garage
#                         "directory"  a local directory, such as a mounted volume
# `prefix`                the key prefix every object is under: "fleetring" by default; the
#                         databases' metadata objects are under `<prefix>/.metadata/`, so no
#                         part of a prefix may be `.metadata`
# `segment_interval_ms`   the least time between two segments of a database: 10000
# `snapshot_interval_ms`  how old the newest base snapshot may get: 86400000 (a day)
# `snapshot_after_bytes`  how many bytes of segments bring a new base snapshot: 1073741824
# `keep_snapshots`        how many base snapshots, with the segments that continue them, to keep: 7
#
# For S3:
# `bucket`, `region`      required
# `endpoint`              "https://s3.<region>.amazonaws.com" by default
# `path_style`            false; true puts the bucket in the path, as MinIO needs
# `credentials`           "env" (the default) reads AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and
#                         optionally AWS_SESSION_TOKEN at start; "file" reads `credentials_file`,
#                         a TOML file with `access_key_id`, `secret_access_key`, and optionally
#                         `session_token` that only its owner may read, re-read when it changes
# `ca`                    a PEM bundle of extra authorities, for a private endpoint
# `allow_http`            false; true permits an http:// endpoint, for a local MinIO only
#
# An archive holds every row of the databases it names, unencrypted: give the bucket the care
# the nodes' disks get. Restore with `fleetring db restore <new> --archive <name> --from <db>`,
# or offline, with no fleet, with
# `fleetring archive restore <db> --to <dir> --config <this file> --archive <name>`.
#
# name = "backups"
# databases = ["*"]
# store = "s3"
# bucket = "fleetring-backups"
# region = "eu-west-1"
# endpoint = "https://s3.eu-west-1.amazonaws.com"
# path_style = false
# prefix = "fleetring"
# credentials = "file"
# credentials_file = "/etc/fleetring/s3.toml"
# segment_interval_ms = 10000
# snapshot_interval_ms = 86400000
# snapshot_after_bytes = 1073741824
# keep_snapshots = 7
#
# [[archive]]
# name = "local"
# databases = ["ledger"]
# store = "directory"
# path = "/backups/fleetring"

# [admin]
# The admin listener (ADR-0034): HTTP/1.1 apart from the gRPC port, serving `/metrics` (OpenMetrics
# text), `/healthz` (200 while the process can serve), and `/readyz` (200 when the node should get
# work; 503 with a JSON body naming each failing check, such as `draining`). The daemon README's
# "Observability" section lists every metric and check.
#
# The default address is loopback, which inside a container is reachable only from the container
# itself. To scrape or probe from outside, set `listen` to a reachable address and either
#   tls = true              serve HTTPS with this node's [tls] certificate; `/metrics` then needs
#                           a client certificate whose principal `scrapers` lists (issue one with
#                           `fleetring cert client prometheus`), and the probes answer anyone
#   allow_plaintext = true  serve plaintext to anyone who can connect, for a network you control
#                           (a pod network behind a network policy); the daemon warns at every start
# A non-loopback `listen` with neither fails validation.
#
# enabled = true                 # false: no admin listener; metrics are still kept
# listen = "127.0.0.1:7401"
# tls = false
# scrapers = ["prometheus"]      # principals whose client certificates may read /metrics over TLS
# allow_plaintext = false
# sample_interval_ms = 10000     # how often the gauges over databases and members are refreshed

# [limits]
# What one request may take on a data node (FR-078). New in 0.8.0: a 0.7 node refuses the table,
# so add it only once the node runs 0.8. A write, query, or schema read still running
# `statement_timeout_ms` after the node took it is interrupted: a query fails with
# DEADLINE_EXCEEDED and a write rolls back, committing and replicating nothing. A client that
# sets an earlier deadline (`db query --timeout`, `fleetring mcp`) gets that one, and a cancelled
# call stops its statement at once.
# statement_timeout_ms = 30000

# [sessions]
# How the router's Hrana streams may hold a database's writer on its primary (ADR-0037). A
# stream's transaction holds the writer from its first write to its COMMIT or ROLLBACK: other
# writes wait, reads go on. A transaction open longer than `transaction_timeout_ms` is rolled
# back, so a client that walks away can't hold a database; a write past `max_waiting_writes`
# behind one is refused with RESOURCE_EXHAUSTED and never runs, and one principal's sessions may
# take at most half those places. A write's [limits] statement_timeout_ms counts from when it
# starts, after any wait behind a transaction, and it may wait up to `transaction_timeout_ms`
# besides: a write queued behind a transaction of full length still gets its whole statement
# time. A call's own deadline, as `db exec --timeout` sets, bounds the wait and the statement
# both. A waiting write holds up no drain: it is admitted when it starts, under its lease.
# transaction_timeout_ms = 30000
# max_waiting_writes = 64          # per database
# max_sessions_per_principal = 256 # sessions one principal (a forwarded token's own) may hold
# idle_timeout_ms = 60000          # a session with no call for this long is ended

# [log]
# How log lines are written to stderr: "text" (the default) or "json", one object per line with
# the current span; every request's lines carry its `rpc` span and `request_id`. `--log-format`
# and FLEETRING_LOG_FORMAT override it. `RUST_LOG` sets the level (info by default).
# format = "text"

# Principals: what each client certificate may do (ADR-0025). Every connection carries a
# certificate, and a principal (`cert client <name>`) may do only what its scopes allow; one this
# file doesn't list may do nothing with its certificate alone. Keep the list identical on every
# node. A scope is `<action>:<pattern>`, the action `read`, `write`, `admin`, or `stream` over an
# exact database name or a prefix ending in `*`; `write` implies `read`, `admin` implies both,
# and `stream` stands alone. `fleet` allows the operations that name no database: membership,
# draining, revoking tokens. The table of what each RPC needs is in the daemon README, under
# "Principals and scopes". A prefix is bytes: `admin:agent-42*` also covers `agent-420`, so end
# each prefix with a separator (`admin:agent-42-*`); the daemon logs a warning at start for one
# that doesn't.
#
# An application usually connects with its own certificate and a short-lived token instead:
#
#   fleetring token issue --principal notes-app --scope write:notes --ttl 1h --dir ./tls
#
# The token carries its scopes, so `notes-app` needs no entry here. A request with a token acts
# with the token's scopes alone; `fleetring token revoke --token-id <id>` refuses it on every node
# within one heartbeat interval.
[[principal]]
name = "admin"
scopes = ["admin:*", "stream:*", "fleet"]

# The router (`fleetring router`, deploy/router.toml) relays its callers' tokens: its own
# certificate grants nothing, and a request carrying a caller's token acts as that caller.
# [[principal]]
# name = "router"
# scopes = []
# forward_tokens = true
